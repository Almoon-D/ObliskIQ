# The LLM layer (MASTER_PLAN §5.10; DECISIONS D70, D188): a registry of providers and models, the
# minimal EventExtractor, the analyst's segments and the weekly forecast panel. A change of model
# or prompt starts a new labelled segment of a role's stored series; nothing falls back to another
# model unlabelled.
llm:
  providers:
    # Each provider: the protocol it speaks, its base URL and the environment variable that holds
    # its key. Without the key a role or segment on it makes no call and says so (`no_key`).
    # Gemini's OpenAI-compatible endpoint.
    gemini:
      protocol: openai_compatible
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      key_env: GEMINI_API_KEY
      api_version: null
    # Anthropic's Messages API, spoken natively: its OpenAI-compatible endpoint ignores the
    # answer's schema (docs/knowledge/llm-providers.md). The version is the one its documentation
    # names current; it takes no temperature.
    anthropic:
      protocol: anthropic
      base_url: https://api.anthropic.com/v1
      key_env: ANTHROPIC_API_KEY
      api_version: "2026-10-21"
  models:
    # Prices per million tokens in US dollars on the paid tier, read on the day given in each
    # provider's own pricing page; a free tier charges nothing and the budget counts the paid price
    # anyway. A model's reasoning tokens are output tokens.
    gemini_flash_lite:
      provider: gemini
      model_id: gemini-3.1-flash-lite
      context_window_tokens: 1000000
      input_usd_per_million: 0.25
      output_usd_per_million: 1.50
      prices_read: 2026-11-27
      effort: null
    # Google's most capable Flash model. Its prices double on 2027-01-01 (3.75 → 7.50 output, the
    # pricing page of 2026-11-27): re-read them then.
    gemini_flash:
      provider: gemini
      model_id: gemini-3.8-flash
      context_window_tokens: 1000000
      input_usd_per_million: 0.75
      output_usd_per_million: 3.75
      prices_read: 2026-11-27
      effort: null
    # Anthropic's most capable widely released model; it always thinks, at the effort given.
    claude_fable:
      provider: anthropic
      model_id: claude-fable-5-2
      context_window_tokens: 1000000
      input_usd_per_million: 8.00
      output_usd_per_million: 40.00
      prices_read: 2026-11-27
      effort: high
  budget:
    # Spend per calendar month (UTC), in the providers' price currency, over every role. A call
    # whose worst-case cost would pass it, or would pass its segment's share, is not made. The
    # owner's setting (D188): raise it when a second provider's key is added.
    monthly_usd: 5.00
    # A call's input tokens are estimated before it is made from its characters at this rate,
    # low on purpose (fewer characters a token is more tokens): the check errs on the cautious
    # side, and the cost recorded is the provider's own count.
    chars_per_token_estimate: 3
  extractor:
    model: gemini_flash_lite
    # A change of model or prompt starts a new labelled segment of H7's series.
    prompt_version: 1
    temperature: 0
    max_output_tokens: 1024
    # Items per collector run, oldest waiting first.
    max_items_per_run: 100
    # An item's text is cut to this many characters before it is escaped into the prompt.
    max_item_chars: 4000
    request_timeout_seconds: 60
    # One retry with the validation error, then the item fails closed.
    retries_on_invalid: 1
    # A call that fails (the provider down, a timeout) leaves its item queued; after this many
    # failed calls the item waits no more.
    max_call_failures: 3
  analyst:
    # The Analyst role (MASTER_PLAN §5.5, §5.10; DECISIONS D156, D188): theses it proposes on its
    # own from the point-in-time fact sheet, a second opinion on each of the owner's ideas, and a
    # weekly review of what is open. It runs as segments side by side, every one in shadow and
    # graded in the idea ledger; a segment's models, its prompt version and the passes below are
    # part of its prompt's hash, so a change starts a new segment of the forward record (D128).
    segments:
      # The low-cost model alone.
      lite:
        scan_model: gemini_flash_lite
        dossier_model: gemini_flash_lite
        prompt_version: 1
        budget_share: "0.2"
      # A mid model writes the dossiers and the reviews.
      mid:
        scan_model: gemini_flash_lite
        dossier_model: gemini_flash
        prompt_version: 1
        budget_share: "0.3"
      # The strongest model writes the dossiers and the reviews.
      strong:
        scan_model: gemini_flash_lite
        dossier_model: claude_fable
        prompt_version: 1
        budget_share: "0.4"
    # The segment whose drafts may take the thesis book's slots and which writes the second
    # opinions; the others are graded and never trade. The owner's setting, changed on the machine
    # with `obliskiq settings set` and audited (D177); never chosen automatically.
    trading_segment: lite
    scan:
      # Candidates one scan may name, each with one line of reason. A judgement: a dossier each.
      max_candidates: 5
      max_output_tokens: 4096
    dossier:
      # A judgement: room for one thesis with its reasons and for the model's own reasoning.
      max_output_tokens: 16000
      # Besides the lines that name the candidate and those the scan cited, every dossier reads
      # these sections of the sheet whole: the economy every thesis rests on.
      context_sections: [macro]
    review:
      max_output_tokens: 4096
      # The most theses one segment reviews in an ISO week: the owner's open ideas first, then its
      # own open calls, newest first. A judgement against the strongest model's price.
      max_theses_per_week: 10
    # Sent where the protocol takes it (Anthropic's current version takes none).
    temperature: 0
    request_timeout_seconds: 300
    # One retry with the validation error, then the call fails closed and nothing is used.
    retries_on_invalid: 1
    # A second opinion whose call fails (the provider down, a timeout) is asked again on later
    # runs, up to this many failed calls.
    max_call_failures: 3
    # The most drafts one segment hands to the thesis book's intake in an ISO week (Monday to
    # Sunday). A judgement: the book holds eight positions and a thesis runs for months.
    max_drafts_per_week: 3
    # The most drafts one segment proposes in one run; the idea ledger grades every one of them
    # (H14, D187). A judgement: within the week's number, one run may use it all.
    max_drafts_per_run: 3
    # A draft's horizon is at most this many days after the fact sheet's date. A judgement: the
    # forward record is read every six months (H13), and a thesis longer than a year holds a slot
    # through two looks without an answer.
    max_horizon_days: 365
    fact_sheet:
      # The equity grid's leaves a cell's line carries (the rest of a cell is in the store; a
      # cell with none of them measured is counted, not listed).
      grid_leaves: [return_21d_base, return_63d_base, return_12m_base, distance_from_52w_high,
                    realised_vol_30d_percentile, iv_percentile, positioning_percentile]
      # An instrument's line: its last close and its return over each of these sessions.
      return_sessions: [21, 63]
      # A close older than this many days before the sheet's date is shown as stale.
      price_stale_after_days: 5
      # News items collected in this many days up to the sheet's date are read, newest first, at
      # most `max_news_lines`. Judgements.
      news_lookback_days: 7
      max_news_lines: 40
      # Prediction markets: the curated ones first, then the largest moves, at most this many.
      max_market_lines: 20
      # Issuers with open-market purchases by officers or directors in the cluster window, the
      # most buyers first, at most this many.
      max_insider_lines: 15
      # The stock screen's first names the sheet carries, each labelled untested (D180).
      stock_screen_top: 20
  panel:
    # The weekly forecast panel (research/preregistrations/scoreboard.md "The weekly forecast
    # panel"; ported from Inversor-Inteligente's modules/analytics/forecast_panel.py with its
    # values). The monthly budget is the layer's; the horizon, the mark age, the minimum names and
    # the coverage are the pre-registration's, not this block's. A change here (the prompt's hash
    # or the model) or of the universe starts a new record.
    model: gemini_flash_lite
    prompt_version: 1
    temperature: 0
    max_output_tokens: 8192
    request_timeout_seconds: 120
    # One retry with the validation error, then the batch fails closed.
    retries_on_invalid: 1
    # Names per call: about 40 compact rows fit every provider's window.
    batch_size: 40
    # A batch whose answer covers fewer of its names than this share is invalid.
    min_batch_coverage: "0.8"
    # Batches that failed in a row before the run stops spending calls (quota or outage).
    max_consecutive_failures: 2
    # Seconds between batches: the panel shares per-minute limits with the analyst.
    batch_pause_seconds: 4
    # A name needs this many stored closes to be forecast; 12-1 momentum needs its lookback and
    # one more, and is given without a value below that.
    min_history_sessions: 64
    return_sessions: [21, 63]
    momentum_lookback_sessions: 252
    momentum_skip_sessions: 21
    volatility_sessions: 60
    min_volatility_returns: 20
    high_sessions: 252
    annualisation_sessions: 252
    # A stated probability is clamped into these bounds; an expected excess beyond the limit
    # (percent over the horizon) makes the forecast invalid, and the prompt asks for one inside
    # the range.
    probability_bounds: ["0.02", "0.98"]
    max_abs_excess_pct: 50
    asked_excess_range_pct: 25
