# ─────────────────────────────── Your settings ───────────────────────────────
#
# This is the one file you edit. Anything you write here overrides the expert default of
# the same name in config/defaults/. Keep a setting out of this file to use the default.
#
# After an edit, check it with:   obliskiq config validate
# See every setting in force:     obliskiq settings show
#
# Changes take effect the next time ObliskIQ reads its configuration.

account:
  # The currency the account is measured in: budgets, caps and benchmarks are expressed
  # in it. Other currencies may still be held as working balances.
  base_currency: EUR

# Where you are tax-resident. It selects config/jurisdictions/<id>.yaml, which decides what
# may be bought and how gains are taxed. `es` is Spain.
jurisdiction: es

market_data:
  # The IBKR market-data subscriptions on your main username, shared with its paper account (the
  # feeds are listed in config/defaults/market_data.yaml with their prices). With OPRA L1, Eurex
  # Core L1 and the complimentary US feed the options sleeve starts on US-listed options; every
  # other venue is read delayed.
  plan: [opra_l1, eurex_core_l1, us_complimentary]

vehicles:
  swap_partners:
    # A swap partner may track the same index as the vehicle it replaces, provided it comes from
    # another issuer (Spain's rule, RIRPF art. 8). Your ruling of 2026-10-23 (DECISIONS D123).
    same_index: true
