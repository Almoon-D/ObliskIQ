  candidates:
    # Stock candidates (MASTER_PLAN §5.3, "Finding the stocks") come from the instruments' holdings
    # files above (a holding counts for the grid market of its location, and for the market the
    # file's candidates_for names) and from IBKR's market scanner per venue. A cell with no
    # candidate declares why; `obliskiq collect candidates` reports a cell that has none and
    # declares nothing, and a declared gap that has filled.
    # Scanners: the US location is the one IBKR's reference documents; the other venues' location
    # codes are read from /iserver/scanner/params on the first live run (VERIFY-LIVE(scanner
    # location codes per venue)).
    scanners:
      - {market: us, instrument: STK, location: STK.US.MAJOR, scan_type: MOST_ACTIVE}
