# ═══════════════════════════════════════════════════════════════════════════════════════════════
#  ObliskIQ — the universe (MASTER_PLAN §5.3, §5.7)
#
#  Every instrument the system reads, the grid and macro-board axes it is measured on, the futures
#  curves it collects and the sources of its stock candidates. Validated by
#  src/obliskiq/config/schema_universe.py, which refuses an incomplete grid or board; seeded into
#  the store by `obliskiq collect universe`; checked by `obliskiq universe validate`.
#
#  Reading any instrument as data is always allowed. Whether one may be BOUGHT is computed by the
#  jurisdiction's eligibility policy (config/jurisdictions/<id>.yaml) from the attributes below,
#  never declared here. A leveraged or inverse product is rejected at ingestion by its resolved
#  description (instruments.leveraged_inverse_markers).
#
#  Ported from legacy/lite/universe.yaml @b1ebd49, all of it: lite's comments are kept in each
#  block, prefixed with the key they annotated. Tags: [CP ✓ date] read live on the Client Portal
#  API, [MCP ✓ date] in IBKR's connector; lite's own readings keep lite's tags.
#
#  Per instrument:
#    conid             the pinned contract (nothing is searched); null: resolved at seeding by
#                      contract search on the listing venue, confirmed by its contract details
#    listing_exchange  IBKR's code of the venue that lists it (venues.yaml maps codes to venues)
#    history_exchange  what a history request sends; null sends none (TSEJ, BM, SBF and EBS serve
#                      history only without it)
#    option_exchange   what a chain request sends, verbatim; null: the chain's own exchange list
#    description       the contract's resolved description, which the markers read; null until
#                      resolved, and an instrument without one is never traded
#    roles             data | tradable_candidate | option_underlying (its chain is collected)
#    data_only_reason  why it is not a tradable candidate
#    attributes        what eligibility, tax and the vehicle selector read; null is unknown
#    exposures         its grid cell (measures: it is the cell's measurement), the macro-board
#                      cells it claims (region.asset_class), core roles, the country a
#                      concentration cap counts it against, its commodity bucket
#    holdings          the issuer's holdings file: the look-through, and with candidates_for the
#                      market whose stock candidates it supplies
#    coverage_note     what the measurement is and is not
#    collect_bars, bars_off_reason
#    options_unavailable_reason
#                      why no chain is reachable; required on a cell-measuring row that collects
#                      none, because "no chain today" and "no chain ever" are different claims
# ═══════════════════════════════════════════════════════════════════════════════════════════════

universe:
  grid:
    # ── The grid axes ───────────────────────────────────────────────────────────
    #
    # Declared, not derived. A market x sector cell with no mapped instrument must
    # be an explicit `n/a` with a reason; if the axis were derived from whatever
    # happens to be declared below, that cell would simply never exist and the
    # coverage gap would be invisible.
    #
    # `broad` is the market-level row, measured on the NATIVE INDEX. The other
    # eleven are the standard sector taxonomy. Commodity BUCKETS are a separate
    # axis and live in commodity_state, not here.
    sectors: [broad, energy, materials, industrials, consumer_discretionary, consumer_staples, healthcare, financials, technology, communication_services, utilities, real_estate]
    broad_sector: broad
    markets:
      us:
        currency: USD
        country: US
        native_index: SPX
      eurozone:
        currency: EUR
        country: EU
        native_index: ESTX50
      germany:
        currency: EUR
        country: DE
        native_index: DAX
      spain:
        currency: EUR
        country: ES
        native_index: IBEX35
      france:
        # A BROAD-ONLY market, and that is a first-class row rather than a lesser
        # one: broad momentum, the two range-based realised-vol estimators, the
        # policy rate and the curve slope are what allocation reads, and germany has
        # run on exactly this shape since the axis was declared. See
        # docs/DECISIONS.md.
        #
        # CAC is PINNED because the bare ticker is a trap twice over. It resolves
        # first to CAMDEN NATIONAL CORP, a USD US bank; CACX is this same Amundi fund
        # quoted in GBP on the London line; and C40 (305372184) is AMUNDI CAC 40 ESG
        # UCITS, a DIFFERENT INDEX whose currency is right and whose constituents are
        # the screened subset. All three confirmed live 2026-09-14 on cp_api.
        currency: EUR
        country: FR
        native_index: CAC
      italy:
        currency: EUR
        country: IT
        native_index: CSMIB
      uk:
        # a fund: no FTSE 100 index contract serves. See instruments.
        currency: GBP
        country: GB
        native_index: ISF
      japan:
        currency: JPY
        country: JP
        native_index: N225
      korea:
        currency: KRW
        country: KR
        native_index: K200
      hong_kong:
        currency: HKD
        country: HK
        native_index: HSI
      china:
        # GAP CLOSED, on the second attempt and by a different route. The first probe
        # looked for an index contract and for a Hong Kong listing, found XIN9 is not
        # a contract, XIN9I an empty series, and iShares FTSE China A50 priced in HKD,
        # and correctly refused the A50: measuring a CNY market on an HKD fund reports
        # HKD returns under China's name and hands indicator 11 an EURCNY series that
        # does not describe them. What it did not look at is SEHKNTL — Shanghai-Hong
        # Kong Stock Connect northbound — which reaches Shanghai-listed funds at their
        # own Shanghai quote. See 510300 under instruments, and the currency caveat
        # recorded there and in docs/DECISIONS.md.
        currency: CNY
        country: CN
        native_index: '510300'
      india:
        currency: INR
        country: IN
        native_index: NIFTYBEES
      israel:
        # a fund: no TA-35 index contract exists at IBKR.
        currency: ILS
        country: IL
        native_index: KSM.F59
      brazil:
        # a fund: no Ibovespa index contract resolves.
        currency: BRL
        country: BR
        native_index: BOVA11
      australia:
        # a fund: the AS51 contract is on PSE and returns empty.
        currency: AUD
        country: AU
        native_index: STW
      canada:
        # The one market on this axis outside the US whose option chain is both
        # reachable AND priced — measured 2026-09-14, see XIU under instruments. It
        # is therefore NOT a broad-only row: indicators 7, 8 and 9 reach canada/broad.
        currency: CAD
        country: CA
        native_index: XIU
    unmapped_cells:
      - market: germany
        sectors: remaining
        reason: >-
          no single-country German sector fund resolves on this route. German sector exposure is
          measured on the eurozone row instead, from the iShares STOXX Europe 600 series, which is
          a EUROPEAN read rather than a German one — and that is a coarser measurement, not a
          substitute. A DAX-sector index would be a different index, not a finer one, and none is
          listed.
      - market: spain
        sectors: remaining
        reason: >-
          no IBEX sector fund exists on this route, and no Spanish single-sector ETF of any
          provider resolves. Spain keeps its broad cell on IBEX35 and its macro series; European
          sector exposure is on the eurozone row.
      - market: france
        sectors: remaining
        reason: >-
          no single-country French sector fund resolves on this route, exactly as for germany and
          spain. French sector exposure is measured on the eurozone row, from the iShares STOXX
          Europe 600 series, which is a EUROPEAN read rather than a French one — a coarser
          measurement and not a substitute. A CAC sector index would be a different index, not a
          finer one, and none is listed.
      - market: italy
        sectors: remaining
        reason: >-
          no FTSE MIB sector fund exists on this route, and no Italian single-sector ETF of any
          provider resolves. Italy keeps its broad cell on CSMIB and its macro series; European
          sector exposure is on the eurozone row.
      - market: uk
        sectors: remaining
        reason: >-
          iShares UK Property is the only single-sector fund the sweep found listed in London in
          sterling. The rest of the LSE sector range — the Invesco XLxS and XLxP series — tracks
          the US S&P sectors and is denominated against them, so declaring one here would report an
          AMERICAN sector under Britain's name, which is the wrapper failure this file exists to
          prevent.
      - market: korea
        sectors: remaining
        reason: >-
          IBKR's KRX ETF coverage on this route is banks, steel, construction and transport, and
          nothing else. Probed 2026-09-03 and returning NO contract: 091160 (KODEX Semiconductor),
          091180 (KODEX Autos), 117460 (KODEX Energy & Chemicals), 266420 (KODEX Healthcare),
          139260 (TIGER 200 IT). The gap is in what the route serves, not in what Korea lists.
      - market: hong_kong
        sectors: remaining
        reason: >-
          no Hang Seng sub-index fund is listed beyond the TECH one that measures
          hong_kong/technology. What SEHK does carry in this shape are CHINA sector funds — Global
          X China Semiconductor (3191) and its siblings — which are mainland reads quoted in HKD:
          the wrong country for this row and the wrong currency for china's.
      - market: china
        sectors: remaining
        reason: >-
          Stock Connect northbound reaches Shanghai-listed funds, which is how china/broad is
          measured, but no CSI 300 SECTOR fund resolves on that route. The China sector funds that
          do resolve are SEHK-listed and quoted in HKD, and an HKD fund under a CNY market's name
          decomposes against EURCNY, which does not describe it — the same objection that rejects
          the FTSE China A50.
      - market: israel
        sectors: remaining
        reason: >-
          TASE's two ETF families are broad-market, foreign-index and bond trackers: of roughly 210
          KSM funds and 119 Tachlit funds, the only ISRAELI sector index among them is banks, which
          measures israel/financials. Sector granularity beyond banks is not listed rather than not
          looked for.
      - market: brazil
        sectors: remaining
        reason: >-
          the It Now index-fund family covers the Bovespa financials and basic materials indices
          and stops there. B3's remaining listed funds are broad, small-cap, dividend, ESG and
          fixed-income products, none of which is a sector.
      - market: australia
        sectors: [energy]
        reason: >-
          Australia's resources index does not separate miners from energy producers, so OZR —
          which measures australia/materials — already carries this sector's constituents. Mapping
          it here as well would put ONE series in two cells and report their correlation as a
          finding. Declared a gap rather than measured twice.
      - market: australia
        sectors: remaining
        reason: >-
          the ASX sector-fund range is resources, financials, listed property and technology, all
          four of which are mapped above. No ASX-listed fund covers the remaining sectors.
      - market: canada
        sectors: remaining
        reason: >-
          the TSX sector range IBKR serves is the iShares S&P/TSX Capped sector family, and it was
          not swept: canada was declared on its broad cell and its chain, which is what the market
          axis was widened for. This is a gap nobody has looked into rather than one somebody
          looked into and found empty, and it is written that way on purpose — the two are
          different claims and only the first is worth a probe.
      - market: india
        sectors: remaining
        reason: >-
          no NSE sector fund was probed. The Indian ETF range is broad-index, gold and debt-heavy
          and the sector products that exist are bank and IT trackers, but none of that was
          measured on this route, so this is an unswept gap rather than an empty one.
  macro_board:
    # Region x asset class (MASTER_PLAN §5.7). A cell is mapped when an instrument claims it (its
    # exposures.macro_board), or names macro series (declared with their sources and release dates
    # in Session 10) or futures roots; otherwise it says why it has none. The series ids are lite's
    # per-market declarations (universe.yaml markets), regrouped by what they measure; each null in
    # lite is an unmapped cell here with lite's own reason.
    asset_classes: [equity_index, rate_2y, rate_10y, curve, real_rate, fx_vs_base, credit, vol_index, commodities]
    regions:
      us:
        # Grid indicator 15 exists only where a futures contract does. Declared per
        # market rather than inferred, and absent everywhere it does not apply.
        currency: USD
        cells:
          equity_index: {series: [COT_SP500], roots: [], label: cot_positioning, unmapped: null}
          rate_2y: {series: [DGS2], roots: [], label: null, unmapped: null}
          rate_10y: {series: [DGS10], roots: [], label: null, unmapped: null}
          curve: {series: [DGS10, DGS2], roots: [], label: 10y_minus_2y, unmapped: null}
          real_rate: {series: [DFF, CPIAUCSL], roots: [], label: policy_minus_cpi_index_yoy, unmapped: null}
          fx_vs_base: {series: [EURUSD], roots: [], label: null, unmapped: null}
          # Moody's Baa yield less the ten-year Treasury (FRED BAA10Y).
          credit: {series: [BAA10Y], roots: [], label: null, unmapped: null}
          # The VIX and the three-month VIX: their term slope is short over long minus one, the
          # statistic rv_term_slope computes, so a positive slope is an inverted curve.
          vol_index: {series: [VIXCLS, VXVCLS], roots: [], label: short_over_long, unmapped: null}
          commodities:
            series: []
            roots: []
            label: null
            unmapped: >-
