    # ── Cells no instrument measures, and why ───────────────────────────────────
    #
    # EVERY market x sector pair that no row above measures MUST appear here with a
    # reason. The loader refuses a universe where a pair is neither measured nor
    # declared, and refuses a pair claimed twice.
    #
    # That rule is the whole point of this block. The grid used to mark an unmapped
    # cell `inapplicable` by INFERRING it from the absence of a grid_measures row —
    # the one move this design refuses everywhere else, and the same shape as the
    # `options_unavailable_reason` gap that was closed earlier: "nobody looked" and
    # "somebody looked and there is nothing" are different claims, and an absent flag
    # does not distinguish them. A reason written here is a claim a person made and
    # can be held to; a blank is not.
    #
    # These cells are the AMBITION GAP, not a collection failure — no collector run
    # will fill one — so they are excluded from the collection-health denominator and
    # reported as their own ratio. Closing one means finding an instrument, which
    # means a probe, which means this block shrinks.
    #
    # market    a declared market.
    # sectors   an explicit list, or the literal `remaining` for every sector of
    # that market not measured and not claimed by an earlier block.
    # Explicit blocks are declared BEFORE the market's `remaining` block.
    # reason    why, in words, in the cell. It reaches the grid verbatim.
