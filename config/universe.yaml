  # The commodity axis (lite config.yaml commodities.buckets): never one bucket, since the
  # drivers are unrelated, and orthogonal to the sectors (gold is a monetary bucket and a
  # materials sector).
  commodity_buckets:
    - energy  # oil, natgas, refined products
    - precious_monetary  # gold, silver: real rates and the dollar, not the cycle
    - industrial_metals  # copper, aluminium, nickel
    - agri_inputs  # nitrogen (tracks natural gas via Haber-Bosch), phosphate, potash
    - grains_oilseeds  # corn, wheat, soybeans, rice
    - softs  # coffee, cocoa, sugar, cotton
    - strategic_niche  # lithium, uranium, rare earths, industrial gases
