# How the core's rebalancer (decision/rebalance_core.py) turns its target portfolio into orders.
# Amounts and fractions are QUOTED. The core's bands are core.bands.
trading:
  # The smallest trade, in the base currency: `absolute_base`, `fraction_of_managed` (of managed
  # capital), or both combined by `combine` (max: the larger; min: the smaller); either may be
  # null, not both. Never below the commission floor: a trade worth less than its own commission
  # is not made. Judgements.
  min_trade:
    absolute_base: "50"
    fraction_of_managed: "0.02"
    combine: max
  # How long a rebalancing intent lives before it expires unfilled: a trading day. A judgement.
  intent_ttl_minutes: 480
