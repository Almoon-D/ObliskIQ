# Venues the library lacks: fixed hours, a weekday set and a declared holiday list.
# `holidays_through: null` declares nothing: every date is then "not covered" and blocks.
# A sourced holiday list (with the date it is known through) unblocks a venue.
synthetic_calendars:
  XSHE:
    open: "09:30"
    close: "15:00"
    trading_days: [mon, tue, wed, thu, fri]
    holidays: []
    holidays_through: null
  XNSE:
    open: "09:15"
    close: "15:30"
    trading_days: [mon, tue, wed, thu, fri]
    holidays: []
    holidays_through: null
  CHIA:
    open: "10:00"
    close: "16:13"
    trading_days: [mon, tue, wed, thu, fri]
    holidays: []
    holidays_through: null
  XSPX:
    open: "10:00"
    close: "12:00"
    trading_days: [mon, tue, wed, thu, fri]
    holidays: []
    holidays_through: null

# A lunch break the library does not carry. It applies only where the library has no break;
# a venue that gains a library break must drop its entry (a build error otherwise).
lunch_breaks:
  XSHE:
    start: "11:30"
    end: "13:00"
    source:
      origin: "market-pulse-bot config/exchanges.yaml @900dbf4 (synthetic lunch)"
      verify_live: true
  XSES:
    start: "12:00"
    end: "13:00"
    source:
      origin: "market-pulse-bot README @900dbf4, citing the SGX Rulebook mid-day break; exchange_calendars 4.13.2 documents that it skips this break"
      verify_live: true

# A regular close that moves while another market observes daylight saving. `close` replaces
# the library's close on those days.
seasonal_closes:
  BVMF:
    reference_timezone: America/New_York
    close: "17:00"
    source:
      origin: "market-pulse-bot config/exchanges.yaml @900dbf4 and README: B3 closes earlier while New York is on daylight saving time"
      verify_live: true

