# Calendars and venues.
#
# What decides when a venue is tradable: the library calendar (or a synthetic one), the phase
# windows around the session, the order-window offsets and the IBKR exchange-code map. Read by
# obliskiq.calendars. Every block carries a `sources` note; `verify_live: true` means the value
# came from a legacy source and still awaits a live reading (docs/ROADMAP.md, Live verification
# queue). The IBKR codes are pinned for real in Session 8.
#
# Times are quoted "HH:MM" (YAML reads an unquoted 10:00 as the number 600).
#
# `venues` is keyed by market code (MIC). Unless the MIC is in `synthetic_calendars`, it is also
# the exchange_calendars name of the venue's calendar. `settlement_sessions` is how many of the
# venue's sessions after a trade its cash settles on (T+n), counted on the venue's calendar: the
# reservation planner's lag (DECISIONS D108), with its source under `sources.settlement`; null is
# not sourced, and no sale is planned there. The venue profile (MASTER_PLAN §5.3): `currencies`, the
# currencies its listings trade in (a universe instrument must list in one of them);
# `trading_permission`, the IBKR permission an order there needs; `board_lot`, the standard unit of
# its shares (null where it varies by stock or is not sourced), each with its source under
# `sources`. Market-data cost and availability are the feeds of config/defaults/market_data.yaml.
# Venue-specific extras live in the side sections below, keyed by the same MIC, so no venue
# carries a null for a block it lacks.

calendars:
  # How much calendar to build around today: sessions, holidays and early closes outside
  # [today - history_years, today + horizon_years] are "not covered" and block, never open.
  # Long enough for a long-dated option, short enough that every library covers it.
  history_years: 2
  horizon_years: 3
  # Orders go only in [open + after_open, close - before_close] of the regular phase.
  # Expert judgement, not a measurement; Session 18's cost analysis calibrates it.
  order_offsets:
    after_open_minutes: 30
    before_close_minutes: 15
  # Per-venue overrides of order_offsets, keyed by MIC. Empty: every venue uses the default.
  venue_order_offsets: {}
  # A cross-check source (Session 3 registers IBKR's trading schedule) that places a session's
  # open or close further than this from the calendar's is a disagreement.
  cross_check:
    time_tolerance_minutes: 5
  # An incident keeps blocking this long after its expected end, in case trading has not
  # actually resumed. An open-ended incident blocks until it is removed.
  incidents:
    grace_minutes: 30

venues:
  XNYS:
    name: "NYSE"
    region: America
    timezone: America/New_York
    settlement_sessions: 1
    currencies: [USD]
    trading_permission: "Stocks: United States"
    board_lot: null
    phase_windows:
      - {phase: pre_market, anchor: session_open, start_offset_minutes: -330, end_offset_minutes: 0}
      - {phase: closing_auction, anchor: session_close, start_offset_minutes: -10, end_offset_minutes: 0}
      - {phase: post_market, anchor: session_close, start_offset_minutes: 0, end_offset_minutes: 240}
    # Nasdaq Trader's halt feed lists halts by listing market (DECISIONS D125; NYSE listings are
    # VERIFY-LIVE, docs/knowledge/macro-sources.md): a single-stock halt blocks that instrument
    # only; a market-wide halt stays a manual entry.
    incident_source: {type: structured_feed, scope: single_stock}
    sources:
      calendar:
        origin: "exchange_calendars 4.13.2 calendar XNYS"
        verify_live: false
      phases:
        origin: "market-pulse-bot config/exchanges.yaml @900dbf4 (legacy/pulse): offsets as source-checked there; not re-verified here"
        verify_live: true
      settlement:
        origin: "SEC Rule 15c6-1 as amended (Release 34-96930): T+1 from 2024-05-28"
        verify_live: false
      currencies:
        origin: "the venue's local currency"
        verify_live: false
      permission:
        origin: "IBKR's trading-permission settings, which group permissions by product and country; the name is this file's, and the account's grants are read in Session 9 (broker capabilities)"
        verify_live: true
      lots:
        origin: "not sourced; an order's size follows IBKR's contract rules (size increment) at order time"
        verify_live: false
