# Venues the library lacks: fixed hours, a weekday set and a declared holiday list.
# `holidays_through: null` declares nothing: every date is then "not covered" and blocks.
# A sourced holiday list (with the date it is known through) unblocks a venue.
synthetic_calendars:
  XSHE:
    open: "09:30"
    close: "15:00"
    trading_days: [mon, tue, wed, thu, fri]
    holidays: []
    holidays_through: null
