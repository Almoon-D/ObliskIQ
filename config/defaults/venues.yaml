  XSHE:
    start: "11:30"
    end: "13:00"
    source:
      origin: "market-pulse-bot config/exchanges.yaml @900dbf4 (synthetic lunch)"
      verify_live: true
  XSES:
    start: "12:00"
    end: "13:00"
    source:
      origin: "market-pulse-bot README @900dbf4, citing the SGX Rulebook mid-day break; exchange_calendars 4.13.2 documents that it skips this break"
      verify_live: true

