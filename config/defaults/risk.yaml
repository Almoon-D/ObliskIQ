# The risk engine (engines/risk): lite's `equity_risk` block (lite's config.yaml:134-144,
# @b1ebd49) with lite's values, and lite's `data.atr_period`, the window those stops are scaled by.
# docs/DECISIONS.md says why each is what it is.
equity_risk:
  # Stops are volatility-scaled, never a fixed percentage: a 20 % stop is noise on a 90-vol name
  # and far too loose on a 15-vol one. lite.
  stop_type: volatility_scaled
  # The stop sits this many ATRs below the entry. lite.
  stop_atr_multiple: 2.5
  # The trailing stop protects a gain without capping it, which is why mandatory scaling out was
  # rejected; it trails the running high by this many ATRs. lite.
  trailing_stop_enabled: true
  trailing_stop_atr_multiple: 3.0
  # The average true range is the simple mean of this many true ranges (lite's data.atr_period).
  atr_period: 20
  # Adding to a loser needs a logged re-underwrite citing a new dated catalyst still ahead. lite.
  allow_averaging_down: false
  # A holding with earnings inside its hold window gets an explicit decision, never silent
  # exposure: hold (carry it), flag_and_size (flag it and size for the gap), force_reduce. lite.
  pre_earnings_rule: flag_and_size
  # An entry above this share of its long-run range going into earnings requires a decision:
  # reduce, hedge, or a stated reason for carrying the gap. lite.
  pre_earnings_range_decile_trigger: 0.90

# The book's breakers (decision/breakers.py; MASTER_PLAN §5.11): lite's `portfolio_circuit_breaker`
# block (lite's config.yaml:145-155, @b1ebd49) with lite's values, and the keys the hard
# breaker and the measurement need. Both breakers measure the managed book's fall, flows
# neutralised, beyond the equity reference's fall over the same days, so a market's fall the
# owner accepts trips neither (DECISIONS D147, D163). Neither sells anything.
portfolio_circuit_breaker:
  # New buys are frozen while the book has fallen more than this beyond the equity reference
  # within the rolling window. QUOTED: compared exactly. lite.
  monthly_drawdown_pct: "0.15"
  # What the rolling-month breaker does: existing positions keep their own exit rules. lite.
  action: freeze_new_buys_and_audit
  # What "a rolling month" counts as, in calendar days: a drawdown is a fact about the book over
  # elapsed time, not over sessions. lite.
  window_days: 30
  # Below this many daily closes there is no drawdown to measure, and a breaker reports n/a
  # rather than "fine". lite.
  min_observations: 2
  # The hard breaker: the mode is forced to shadow, until the owner resets it, when the book has
  # fallen more than this beyond the equity reference from any daily close since the last reset.
  # QUOTED. A judgement (DECISIONS D163): ten points past the freeze.
  hard_drawdown_pct: "0.25"
  # The decision cycle whose managed NAV is the day's close: the day's last (DECISIONS D88). A
  # peak is taken from closes alone; a value read inside the day never raises it.
  close_cycle: us_late
  # A last close older than this many calendar days is stale: the breakers are unreadable and
  # new buys are refused until a close is recorded. A judgement: a long weekend passes, a week
  # without a close does not.
  max_close_age_days: 5
  # The loss brake (DECISIONS D193, the owner's ruling of 2026-11-25): the book's own fall from
  # its highest daily close since the last reset, with nothing excused by the market's fall. At
  # each step's fall and beyond, a new thesis is entered at `entry_size` of its size; at "0"
  # none is entered until the book recovers above that step. Steps deepen in order. It sells
  # nothing and never raises a size. QUOTED.
  loss_brake:
    steps:
      - {fall: "0.10", entry_size: "0.5"}
      - {fall: "0.20", entry_size: "0"}
  # The equity reference: the universe instrument (config/universe.yaml) whose unit value is read
  # beside every managed NAV; XDWD, the MSCI World fund quoted in euros on Xetra. A judgement.
  equity_reference_conid: 163606916
