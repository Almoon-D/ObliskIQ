# Hygiene on the volatility smile, applied before any implied volatility is read off it. The
# spread, open-interest and session-volume tests reuse config/defaults/liquidity.yaml: the
# question is the same one the candidate gates ask, and a rule enforced twice is eventually
# enforced two different ways.
smile:
  # The delta band. Outside it a quote carries almost no volatility information: a 0.02-delta
  # wing is a lottery ticket whose implied volatility is a rounding artefact.
  min_abs_delta: 0.05
  max_abs_delta: 0.95
  # Butterfly convexity, checked in volatility space: a strike whose implied volatility sits
  # this far off the chord of its two neighbours is a bad print, not a smile.
  butterfly_max_iv_deviation: 0.10
  # Below this many surviving strikes there is no smile, only points.
  min_points: 2
  # The |delta| each leg of the grid's risk reversal is read at (lite smile.skew_delta): a delta,
  # not a moneyness, so it travels between a 15-vol and a 90-vol name unchanged. The band has to
  # bracket it on both sides or the leaf is n/a with the deltas it reached.
  skew_delta: 0.25
  # Which expiry pair defines the implied term slope (lite smile.term_structure). The chain
  # collector buys only expiries inside tenor.entry_dte_min..entry_dte_max, so both targets sit
  # inside that band (a test asserts it). Each leg is the nearest listed expiry to its target; a
  # leg further than max_target_deviation_days from it is not a leg, and two legs closer than
  # min_separation_days are not a term structure.
  term_structure:
    front_target_dte: 95
    back_target_dte: 180
    max_target_deviation_days: 35
    min_separation_days: 45
