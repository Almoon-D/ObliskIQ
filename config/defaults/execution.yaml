# The order path below the pre-trade checks: modes, orders, the reply policy, the quote policy
# and its collar, and the kill switch (MASTER_PLAN §5.12, §5.13).
#
# docs/knowledge/ibkr-orders.md carries IBKR's order endpoints and message ids; docs/DECISIONS.md
# says why each value is what it is. Values marked "lite" are ObliskIQ-lite-MCP's (config.yaml
# `discipline`, @b1ebd49).

# lite's `discipline` block (legacy/lite/config.yaml:333-350): the keys the order path reads.
discipline:
  # Entries are limit orders: a patient limit or an IBKR algo with a limit cap, never a stop.
  # lite.
  entry_order_type: limit_only
  # The only reasons an exit or a protective stop may give. lite's, with rebalance (the core,
  # D104) and withdrawal (the reservation planner's sales, D108).
  exit_reasons_allowed:
    [invalidation, target, time_window, zombie, mandatory_close, stop, trailing_stop, override,
     rebalance, withdrawal]

execution:
  modes:
    # Where a deployment starts when no mode change has been recorded (MASTER_PLAN §5.19: L0).
    # Only shadow or paper: the live levels are reached by the promotion gate and an owner
    # command, never by configuration.
    initial: shadow

  orders:
    # The longest customer order id (cOID) sent. The intent id is a 36-character uuid7; below 36
    # a deterministic short form is sent and the mapping kept. IBKR documents no limit:
    # VERIFY-LIVE(cOID length).
    coid_max_length: 36
    # Warning rounds one placement may take before it is declined.
    max_reply_rounds: 10
    # Days of trades the cOID lookup reads before a placement (IBKR serves at most 7).
    trades_lookup_days: 7

  # Which order warnings (`/iserver/reply` message ids) are confirmed, and for which orders. Any
  # other id is declined, the order cancelled and the owner alerted. `when` narrows an id to the
  # orders that legitimately raise it: any, stop_limit, cash_quantity or conversion.
  reply_policy:
    confirm:
      # IBKR may cap a marketable order's price: it can only make a fill less likely.
      - {message_id: o10153, when: any}
      # The stop-order risk notice, for the stop-limit protective exits.
      - {message_id: o10331, when: stop_limit}
      # The cash-quantity notices, for orders sized in money.
      - {message_id: o10164, when: cash_quantity}
      - {message_id: o10223, when: cash_quantity}
    # "No market data": confirmed only under the quote policy and the collar below, never listed
    # in `confirm`.
    no_market_data_message_id: o354

  # The quote an order may rest on, per asset class (MASTER_PLAN §5.13). An asset class no rule
  # names has no quote policy, and its orders are refused. `max_quote_age_seconds` is how long
  # ago the quote may have been read; `max_delay_seconds` how late a delayed quote may be (IBKR's
  # documented bound for delayed quotes is 1200 s, DECISIONS D38).
  quote_policy:
    - {policy: realtime_required, asset_classes: [option], max_quote_age_seconds: 60}
    - policy: realtime_preferred
      asset_classes: [stock, etf, etc, bond, fx]
      max_quote_age_seconds: 60
      max_delay_seconds: 1200
    - {policy: nav_priced, asset_classes: [fund]}

  # How far a limit may reach through the reference price, as a fraction of it:
  # base_fraction + sigma_multiplier × σ × √(delay in years of trading time). A real-time quote
  # has no delay and gets the base alone. A judgement, not a measurement: Session 18's
  # transaction-cost analysis calibrates it.
  collar:
    base_fraction: 0.005
    # The widest collar any quote may give; past it the sigma is implausible and the order is
    # refused. A judgement.
    max_fraction: 0.05
    sigma_multiplier: 2.0
    # Trading time, for the √(delay) term: sessions a year and hours a session.
    sessions_per_year: 252
    session_hours: 6.5

  kill_switch:
    # How often the sweep reads the live orders while the switch is on. IBKR paces
    # /iserver/account/orders at one request per 5 s.
    sweep_interval_seconds: 10.0
    # How long a read of the switch's database flag may take before the switch counts as on.
    store_timeout_seconds: 5.0

  # The pre-trade gate (execution/pretrade.py): what an order that adds risk may commit. An order
  # that reduces risk (a sell of a managed long position, within it) waives these, the kill
  # switch, buy-side eligibility, the cash check and approval, and nothing else (DECISIONS D56).
  # Amounts are QUOTED STRINGS: the gate compares them exactly.
  pretrade:
    caps:
      # Notional of one order, in the base currency, as a fraction of the account's NAV (the
      # ledger's base row). A judgement: lite's largest initial position
      # (positions.max_initial_size_pct_nav, 0.25).
      max_order_fraction_of_nav: "0.25"
      # Notional cleared in any 24 hours, as a fraction of NAV. A judgement.
      max_daily_fraction_of_nav: "0.50"
      # Orders that add risk cleared in any 24 hours. A judgement.
      max_orders_per_day: 20
    # Cash, in the base currency, that must remain in the order's currency after the order and
    # every other commitment in that currency: room for fees the whatif does not show. A
    # judgement.
    cash_floor: "25"

  # The approval queue (MASTER_PLAN §2: it exists, off by default). Every intent of a sleeve
  # listed here that adds risk waits for the owner's approval (`obliskiq approvals`); for
  # example [options] holds the options sleeve alone.
  approval:
    sleeves: []

  # `obliskiq flatten --confirm`: closing orders for the managed positions.
  flatten:
    # How long a closing intent lives before it expires unsent.
    intent_ttl_minutes: 30
    # Time in force of the closing orders: they end with the session.
    tif: DAY

  # The currency manager (execution/currency.py, MASTER_PLAN §5.12). A trade in a currency other
  # than the base is funded in that currency by a limit-capped spot conversion shortly before it;
  # foreign cash above what the pending orders need and a buffer is brought home. Amounts are in
  # the base currency and QUOTED.
  currency:
    # IBKR's spot pairs a conversion trades (secType CASH, sent with isCcyConv and routed SMART,
    # as IBKR's example sends it). Buying a pair sells its quote currency for its base; selling
    # it sells the base. docs/knowledge/ibkr-orders.md, "Currency conversion".
    # VERIFY-LIVE(conversion conid, sides and fxQty).
    pairs:
      - {symbol: EUR.USD, conid: 12087792, base: EUR, quote: USD}
    # The working balance kept in each foreign currency the account trades, beyond what its
    # pending orders need: room for fees, withholding and income paid in it. A judgement.
    buffer_base: "100"
    # The smallest conversion: a shortfall below it is converted at this size where the cash and
    # the single-foreign-currency cap allow, so IBKR's minimum commission (USD 2.00 a
    # conversion, docs/knowledge/costs.md) weighs at most about 0.2 % of it. A judgement.
    min_conversion_base: "1000"
    # Foreign cash beyond the buffer and the pending orders' needs is brought home once the
    # excess reaches this. A judgement.
    repatriate_above_base: "1000"
    # How far through the pair's reference rate a conversion's limit sits, as a fraction of it;
    # the collar bounds it too. A judgement.
    limit_fraction: "0.002"
    # How long a conversion intent lives before it expires unsent.
    intent_ttl_minutes: 30
    # How long a cycle waits for a conversion to fill before the trades it funds wait for the next
    # cycle, and how often it reads the order meanwhile (IBKR paces the live orders at one read
    # per 5 s).
    fill_timeout_seconds: 60
    fill_poll_seconds: 6

  # Pricing (execution/pricing.py): an IBKR algo with a limit cap where it is enabled for the
  # listing venue and asset class and the contract offers it; otherwise a patient limit inside
  # the reference mid, repriced toward the touch, then cancelled and retried at the next window.
  # Orders route SMART (DECISIONS D97); the cost model is given the listing venue.
  pricing:
    # Each algo is off until a paper order verifies it: VERIFY-LIVE(algo parameters).
    algos:
      - venues: [XNYS, XNAS]
        asset_classes: [stock, etf]
        strategy: Adaptive
        parameters: [{name: adaptivePriority, value: Patient}]
        enabled: false
    # The patient limit starts this many ticks inside the mid (below it for a buy). A judgement.
    start_ticks_inside_mid: 1
    # Reprices toward the touch (the ask for a buy, the bid for a sell), each a modify with a
    # fresh clearance, this many minutes apart; after the last one the order is cancelled and
    # retried at the next tradable window. Judgements: Session 18's transaction-cost analysis
    # calibrates them.
    max_reprices: 3
    reprice_interval_minutes: 5

  # Protective exits (execution/protective.py, DECISIONS D67): stop-limits resting at the broker.
  protective:
    # How long a stop rests at the broker: until it fills or the bot cancels it.
    tif: GTC
    # How long a protective intent lives: it governs the stop's modifies (resizes, roll-ups,
    # reprices), not the order, which is GTC.
    intent_ttl_days: 365
    # The limit sits below the stop by the larger of sigma_multiple times the instrument's daily
    # volatility and its overnight-gap quantile, never less than floor_fraction; a spec wider than
    # max_fraction is refused (a limit that deep acts as a market order). QUOTED. Judgements:
    # Session 18 calibrates them.
    limit_offset:
      floor_fraction: "0.01"
      sigma_multiple: "1"
      max_fraction: "0.10"
    # A stop that triggered and did not fill (a gap through its limit) is repriced toward the bid
    # in steps, each a modify the gate clears as reducing risk, never past the collar.
    gap:
      step_fraction: "0.005"
      max_steps: 6
      step_interval_minutes: 2
      # A limit beyond the collar, deep enough to act as a market order: the owner's decision,
      # off by default (DECISIONS D67). When on, the last step may reach this far below the bid.
      emergency:
        enabled: false
        fraction_below_bid: "0.05"

  # Reconciliation (execution/reconcile.py): the broker's orders, trades, positions and cash
  # against the store. A run that is not green freezes new risk until the next green one.
  reconcile:
    # How long IBKR may take to list a just-placed order or show a fill in the positions before
    # it counts as missing; the executor also waits this long before it places again an intent
    # whose order is not listed. A judgement until Session 5's command list measures the lag.
    grace_seconds: 120
    # Cash movement in one currency that neither the bot's fills nor the owner's recorded flows
    # explain and that is tolerated, in the base currency (fees, rounding). A judgement.
    cash_tolerance_base: "5"
