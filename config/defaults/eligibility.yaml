# The SKELETON eligibility policy (jurisdiction/eligibility.py), which config/jurisdictions/es.yaml
# selects until Session 8 builds the universe and the eu_priips policy and removes this file.
#
# Only the instruments listed here may be bought; everything else is refused as ineligible. Each
# record also describes its instrument for the pre-trade gate (asset class, currency, listing
# venue, the description the leveraged and inverse markers are matched against), because nothing
# else in this build does. An option record names its underlying and expiry; an option whose
# underlying is an ETF or ETC this list does not hold is an option on an ineligible ETP, allowed
# only under the mandatory close (tenor.mandatory_close_trading_days).
#
# Each conid is confirmed through IBKR's contract search by the paper order test before it orders,
# which stops at a mismatch. An owner override replaces the whole list.
eligibility:
  skeleton_allowlist:
    # A UCITS ETF in the base currency: iShares STOXX Europe 600 Banks on Xetra. Lite resolved it
    # and read its daily bars on Xetra [MCP ✓ 2026-08-29] (legacy/lite/universe.yaml); T1's paper
    # order test confirmed the conid [CP ✓ 2026-10-20, the owner's T1 report].
    - conid: 89005163
      symbol: EXV1
      listing_exchange: IBIS
      currency: EUR
      asset_class: etf
      description: iShares STOXX Europe 600 Banks UCITS ETF (DE)
      multiplier: "1"
      underlying_conid: null
      expiry: null
    # A liquid US stock: Freeport-McMoRan on the NYSE. T1's paper order test resolved it through
    # IBKR's contract search to 7089 [CP ✓ 2026-10-20, the owner's T1 report]; lite's conid
    # fixture said 8158.
    - conid: 7089
      symbol: FCX
      listing_exchange: NYSE
      currency: USD
      asset_class: stock
      description: Freeport-McMoRan Inc
      multiplier: "1"
      underlying_conid: null
      expiry: null
    # The skeleton core's vehicles (core.skeleton_targets), UCITS funds all, so they also pass the
    # eu_priips policy that replaces this list in Session 8. Each conid and listing was read from
    # IBKR's contract search on the MCP route, with its description, and a snapshot priced it in the
    # listing's currency [MCP ✓ 2026-10-20]; the run-cycle and serve commands confirm each through
    # /iserver/secdef/search and /iserver/contract/{conid}/info before trading it
    # (VERIFY-LIVE(skeleton conids on CP)).
    # iShares Core MSCI World UCITS ETF (Acc), IE00B4L5Y983 (the vehicle Session 4c's
    # pre-registration names), on the LSE in USD.
    - conid: 78999785
      symbol: IWDA
      listing_exchange: LSEETF
      currency: USD
      asset_class: etf
      description: ISHARES CORE MSCI WORLD
      multiplier: "1"
      underlying_conid: null
      expiry: null
    # iShares Core MSCI EM IMI UCITS ETF (Acc) on Euronext Amsterdam in EUR.
    - conid: 153454120
      symbol: EMIM
      listing_exchange: AEB
      currency: EUR
      asset_class: etf
      description: ISHARES CORE EM IMI ACC
      multiplier: "1"
      underlying_conid: null
      expiry: null
    # iShares € Govt Bond 7-10yr UCITS ETF on Euronext Amsterdam in EUR.
    - conid: 43614383
      symbol: IBGM
      listing_exchange: AEB
      currency: EUR
      asset_class: etf
      description: ISHARES EURO GOVT 7-10YR
      multiplier: "1"
      underlying_conid: null
      expiry: null
