# Where runtime files live, relative to the data directory named by OBLISK_DATA_DIR.
paths:
  # Append-only record of every change to an effective setting (who, when, old -> new, why).
  settings_audit_log: settings-audit.jsonl
  # The SQLite store: instruments, market data, macro series and run records.
  database: obliskiq.db
  # The research store: research history and the trial registry (`obliskiq research`). Kept apart
  # from the database above, which the live path uses.
  research_database: research.db
  # Manual incidents (halts, exceptional closures) the owner enters; see
  # config/manual-incidents.example.yaml. Read by the calendars; a malformed file blocks every
  # venue until it is fixed.
  manual_incidents: manual-incidents.yaml
  # The Client Portal Gateway's install: the verified archive unpacked, its per-install keystore
  # and pinned certificate, and the Gateway's own logs (transport `gateway` only).
  ibkr_gateway: ibkr-gateway
  # The heartbeat's health file: the service rewrites it each heartbeat, so a supervisor can tell a
  # live service from a hung one by its age.
  heartbeat_file: heartbeat.json
  # Which alerts the owner has already heard while their condition holds (reporting/alerts.py).
  alert_state: alert-state.json
  # The lock one service or order command holds while it runs (one process runs the executor).
  service_lock: service.lock
