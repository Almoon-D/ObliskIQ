# What the broker can do through the Web API (MASTER_PLAN §5.3, §5.12), per asset class and venue:
# whether a contract is found by IBKR's contract search (search), quoted by a snapshot (quote) and an
# order on it accepted by a preview (order: whatif, nothing placed), and what its contract rules
# list (order types, algos). An accepted preview also shows the account holds the venue's trading
# permission (venues.yaml: trading_permission). docs/knowledge/ibkr-capabilities.md keeps every
# reading with its date.
#
# A check is `verified` (or `refused`) only as read on the Client Portal route (CP), with the date;
# a reading through IBKR's connector (MCP) is evidence and leaves it `unverified`. An asset class
# and venue without a check here is unverified. The vehicle selector never proposes a vehicle
# whose search, quote and order are not all verified (decision/vehicle_selector.py).
# `obliskiq universe capabilities --probe` reads them on the paper account (whatif only; run on
# the deployment machine, SESSION_PROMPTS §A.5); its report says what to record here.
broker_capabilities:
  checks:
    # ── shares ──
    - asset_class: stock
      venue: XNYS
      probe: FCX
      search:
        status: verified
        route: CP
        observed_on: 2026-10-21
        evidence: "T1's paper order test: FCX resolved to conid 7089 on the NYSE (also 2026-10-20)"
      quote:
        status: verified
        route: CP
        observed_on: 2026-10-21
        evidence: "T1's paper order test: a bid was read (limit 65.14 set below it); availability unreported"
      order:
        status: verified
        route: CP
        observed_on: 2026-10-21
        evidence: "T1's paper order test: a limit buy previewed, commission 1.00 USD, no warning"
      order_types:
        status: unverified
        route: null
        observed_on: null
        values: []
        evidence: "the contract rules were read but the order types not recorded; LMT was previewed"
      algos:
        status: unverified
        route: null
        observed_on: null
        values: []
        evidence: "the algos were read but not recorded by name"
