# The research harness (MASTER_PLAN §5.9; DECISIONS D60–D64). Values a pre-registration fixes
# (theta, the horizon, seeds, the bootstrap, the adequacy checks) live in the pre-registration,
# not here; these are the defaults D62 names and the mechanics every study shares.
research:
  # Where `obliskiq research run` writes its report, relative to the repository that holds the
  # pre-registration.
  reports_dir: research/reports
  # Processes the bootstrap's paths are shared among (1 runs them in this process). The paths are
  # drawn from the pre-registered seed before they are shared, so the result does not depend on it.
  workers: 4

  decision:
    # The interval [L, U] of the primary effect has level 1 - 2 alpha, Bonferroni-adjusted across
    # the tests of a confirmation run (D62). A pre-registration may state its own.
    alpha: "0.05"
    # The power a pre-registration targets to detect theta (D62).
    target_power: "0.8"

  simulation:
    # Delta execution: a position is traded only when the change exceeds this fraction of its
    # target value (legacy walk_forward_backtester delta_no_trade_band_pct @68280e1).
    no_trade_band_fraction: "0.005"
    # At a rebalance date a price older than this does not mark or trade a position; a held
    # position without one stops the run (the legacy backtester looked back seven days).
    max_price_age_days: 7
    # Trade whole units, as the core rebalances (MASTER_PLAN §5.4).
    whole_units: true
    # Calendar days per year for annualising over elapsed time (legacy STRATEGY_V2_DESIGN §3.5).
    days_per_year: "365.25"

  breakeven:
    # The cost multiplier at which the primary effect falls to theta is searched up to this
    # factor; beyond it the report says "above".
    max_multiplier: "20"
    # The search stops when the multiplier is known to this width.
    multiplier_tolerance: "0.001"

  data:
    # Seconds a download may take before it fails (the shared retry policy is `http`).
    timeout_seconds: 60
    # A rate older than this does not convert a price to the base currency.
    max_fx_age_days: 7
    ken_french:
      base_url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/
      # The library's own markers for a missing value.
      missing_markers: ["-99.99", "-999"]
      bias_notes:
        - The library is revised without vintages; a value may differ from what was public then.
        - US portfolios built from CRSP; returns in USD.
    aqr:
      base_url: https://www.aqr.com/-/media/AQR/Documents/Insights/Data-Sets/
      bias_notes:
        - AQR updates and revises its data sets without vintages.
        - Factor returns are excess returns of long-short portfolios before trading costs.
    fred:
      csv_url: https://fred.stlouisfed.org/graph/fredgraph.csv
      api_url: https://api.stlouisfed.org/fred/series/observations
      # ALFRED's widest real-time period: every vintage the archive holds.
      realtime_start: 1776-07-04
      realtime_end: 9999-12-31
      bias_notes:
        - Without vintages FRED serves the latest revision; availability is the observation date plus the declared lag.
    ecb:
      url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip
      bias_notes:
        - ECB euro foreign exchange reference rates, set around 14:15 CET and published around 16:00 CET on TARGET days; a close before publication would not have had the day's rate.
    yahoo:
      bias_notes:
        - Yahoo closes are split-adjusted backwards and not point in time; a split after the date changes the level.
        - The listing's history only; a fund that closed before the download is absent (survivorship).
    msci:
      # MSCI's public end-of-day index levels (the endpoint behind its index pages).
      url: https://app2.msci.com/products/service/index/indexmaster/getLevelDataForGraph
      earliest_start: 1997-01-01
      bias_notes:
        - MSCI index levels are published at the end of each calculation day; MSCI may restate history without vintages.
        - An index, not a fund - no fund costs or tracking difference (a study deducts the vehicle's expense ratio).
    ecb_data:
      # The ECB Data Portal's SDMX REST interface: <base_url>/<flow>/<key>?format=csvdata.
      base_url: https://data-api.ecb.europa.eu/service/data
      bias_notes:
        - ECB Data Portal values as published now; the ECB revises some series without vintages.
    bundesbank:
      # The Bundesbank's time-series database REST interface: <base_url>/<flow>/<key>?format=csv.
      base_url: https://api.statistiken.bundesbank.de/rest/data
      bias_notes:
        - Bundesbank estimates as published now, without vintages.
    derived:
      bias_notes:
        - Computed by the harness from series in the research store; it carries every bias of its inputs.

  # Datasets `obliskiq research data load` knows. Each loads one or more series named
  # <id>.<field>. vendor yahoo: `symbol` (Yahoo's ticker), `currency`, `start`. ken_french: `file`
  # (the zip under base_url), `section` (0 is the first table), `frequency` (monthly or annual),
  # `columns` (null: all), `release_lag_days`. aqr: `file`, `sheet`, `header_row` (1-based),
  # `columns`, `units` (decimal or percent), `release_lag_days`. fred: `series`, `vintages` (true
  # reads ALFRED and needs FRED_API_KEY), `frequency`, `units`, `release_lag_days` (used without
  # vintages), `start`. ecb: `currencies`. Every record adds its own bias notes.
  datasets:
    - id: ecb_fx
      vendor: ecb
      currencies: [USD, GBP, CHF, JPY]
      bias_notes:
        - Units of the currency per euro.
    - id: ff3_monthly
      vendor: ken_french
      file: F-F_Research_Data_Factors_CSV.zip
      section: 0
      frequency: monthly
      columns: null
      release_lag_days: 45
      bias_notes:
        - Fama-French three factors and the one-month bill, monthly, percent converted to decimals.
    - id: aqr_tsmom_monthly
      vendor: aqr
      file: Time-Series-Momentum-Factors-Monthly.xlsx
      sheet: TSMOM Factors
      header_row: 18
      columns: [TSMOM, TSMOM^EQ, TSMOM^FI, TSMOM^CM, TSMOM^FX]
      units: decimal
      release_lag_days: 45
      bias_notes:
        - Moskowitz, Ooi and Pedersen time-series momentum factors, excess returns.
    - id: alfred_cpi
      vendor: fred
      series: CPIAUCSL
      vintages: true
      frequency: monthly
      units: index
      release_lag_days: 45
      start: 1990-01-01
      bias_notes:
        - US CPI for all urban consumers, seasonally adjusted, every published vintage.
    - id: eunl
      vendor: yahoo
      symbol: EUNL.DE
      currency: EUR
      start: 2009-01-01
      bias_notes:
        - iShares Core MSCI World UCITS ETF (accumulating) on Xetra.
    # The US market and the one-month bill, public at the month's close: the market's return
    # and the bill's yield were known then; the library recomputes them from CRSP later.
    - id: ff3_market
      vendor: ken_french
      file: F-F_Research_Data_Factors_CSV.zip
      section: 0
      frequency: monthly
      columns: [Mkt-RF, RF]
      release_lag_days: 0
      bias_notes:
        - The US market's excess return and the one-month bill, monthly; public at the month's close (the market's return and the bill's yield were known then; the library's values are a later reconstruction).
    - id: msci_world_eur
      vendor: msci
      index_code: "990100"
      variant: NETR
      currency: EUR
      start: 1997-01-01
      bias_notes:
        - MSCI World (large and mid caps of developed markets), net total return in EUR, daily; dividends reinvested after the withholding MSCI applies to non-resident institutions.
    - id: msci_em_eur
      vendor: msci
      index_code: "891800"
      variant: NETR
      currency: EUR
      start: 1997-01-01
      bias_notes:
        - MSCI Emerging Markets (large and mid caps), net total return in EUR, daily; dividends reinvested after the withholding MSCI applies to non-resident institutions.
    - id: ecb_eonia
      vendor: ecb_data
      flow: EON
      key: D.EONIA_TO.RATE
      units: percent a year
      start: 1999-01-01
      bias_notes:
        - EONIA, the euro overnight index average, until its end on 3 January 2022; from 2 October 2019 it was the euro short-term rate plus 8.5 basis points.
    - id: ecb_estr
      vendor: ecb_data
      flow: EST
      key: B.EU000A2X2A25.WT
      units: percent a year
      start: 2019-10-01
      bias_notes:
        - The euro short-term rate (euro STR), from 1 October 2019; published the next TARGET day at 08:00 CET.
    - id: bbk_bund_04y
      vendor: bundesbank
      flow: BBSIS
      key: D.I.ZST.ZI.EUR.S1311.B.A604.R04XX.R.A.A._Z._Z.A
      units: percent a year
      start: 1997-01-01
      bias_notes:
        - Zero-coupon yield of listed German Federal securities at a residual maturity of 4 years (Svensson method), daily.
    - id: bbk_bund_05y
      vendor: bundesbank
      flow: BBSIS
      key: D.I.ZST.ZI.EUR.S1311.B.A604.R05XX.R.A.A._Z._Z.A
      units: percent a year
      start: 1997-01-01
      bias_notes:
        - Zero-coupon yield of listed German Federal securities at a residual maturity of 5 years (Svensson method), daily.
    - id: bbk_bund_16y
      vendor: bundesbank
      flow: BBSIS
      key: D.I.ZST.ZI.EUR.S1311.B.A604.R16XX.R.A.A._Z._Z.A
      units: percent a year
      start: 1997-01-01
      bias_notes:
        - Zero-coupon yield of listed German Federal securities at a residual maturity of 16 years (Svensson method), daily.
    - id: bbk_bund_17y
      vendor: bundesbank
      flow: BBSIS
      key: D.I.ZST.ZI.EUR.S1311.B.A604.R17XX.R.A.A._Z._Z.A
      units: percent a year
      start: 1997-01-01
      bias_notes:
        - Zero-coupon yield of listed German Federal securities at a residual maturity of 17 years (Svensson method), daily.
    # EONIA until its last fixing, then the euro STR: the overnight rate a euro money-market
    # fund earns before its costs.
    - id: euro_cash
      vendor: derived
      method: overnight_accrual
      segments:
        - series: ecb_eonia.value
          through: 2021-12-31
        - series: ecb_estr.value
          through: null
      day_count_basis: 360
      currency: EUR
      base_level: "100"
      bias_notes:
        - An overnight deposit rolled every day at EONIA, then the euro STR, actual/360; no fund cost (a study deducts the vehicle's expense ratio).
    # The Bundesbank's Svensson rates are continuously compounded: the published 1-, 5- and
    # 10-year rates of 5 October 2026 equal the Svensson formula of that day's parameters
    # (docs/knowledge/research-sources.md).
    - id: bund_zero_05y
      vendor: derived
      method: constant_maturity_zero
      yield_series: bbk_bund_05y.value
      maturity_years: 5
      shorter_yield_series: bbk_bund_04y.value
      shorter_maturity_years: 4
      compounding: continuous
      year_basis_days: "365.25"
      currency: EUR
      base_level: "100"
      bias_notes:
        - A 5-year zero-coupon German Federal bond rolled daily at constant maturity; German Federal securities only (no other euro government's spread), and a fitted curve rather than traded bonds.
    - id: bund_zero_17y
      vendor: derived
      method: constant_maturity_zero
      yield_series: bbk_bund_17y.value
      maturity_years: 17
      shorter_yield_series: bbk_bund_16y.value
      shorter_maturity_years: 16
      compounding: continuous
      year_basis_days: "365.25"
      currency: EUR
      base_level: "100"
      bias_notes:
        - A 17-year zero-coupon German Federal bond rolled daily at constant maturity; German Federal securities only (no other euro government's spread), and a fitted curve rather than traded bonds.
    - id: tip
      vendor: yahoo
      symbol: TIP
      currency: USD
      start: 2003-01-01
      bias_notes:
        - iShares TIPS Bond ETF (US Treasury inflation-protected securities), NYSE Arca; its fee is in its price.
    - id: ief
      vendor: yahoo
      symbol: IEF
      currency: USD
      start: 2002-01-01
      bias_notes:
        - iShares 7-10 Year Treasury Bond ETF, Nasdaq; its fee is in its price.
    - id: gld
      vendor: yahoo
      symbol: GLD
      currency: USD
      start: 2004-01-01
      bias_notes:
        - SPDR Gold Shares (physically backed), NYSE Arca; its fee is in its price.
    - id: crsox
      vendor: yahoo
      symbol: CRSOX
      currency: USD
      start: 2004-01-01
      bias_notes:
        - Cantor Fitzgerald (formerly Credit Suisse) Commodity Return Strategy Fund, institutional class, a US mutual fund managed against the Bloomberg Commodity Index Total Return; its fee is in its price.
