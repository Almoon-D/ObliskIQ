# The research harness (MASTER_PLAN §5.9; DECISIONS D60–D64). Values a pre-registration fixes
# (theta, the horizon, seeds, the bootstrap, the adequacy checks) live in the pre-registration,
# not here; these are the defaults D62 names and the mechanics every study shares.
research:
  # Where `obliskiq research run` writes its report, relative to the repository that holds the
  # pre-registration.
  reports_dir: research/reports
  # Processes the bootstrap's paths are shared among (1 runs them in this process). The paths are
  # drawn from the pre-registered seed before they are shared, so the result does not depend on it.
  workers: 4

  decision:
    # The interval [L, U] of the primary effect has level 1 - 2 alpha, Bonferroni-adjusted across
    # the tests of a confirmation run (D62). A pre-registration may state its own.
    alpha: "0.05"
    # The power a pre-registration targets to detect theta (D62).
    target_power: "0.8"

  simulation:
    # Delta execution: a position is traded only when the change exceeds this fraction of its
    # target value (legacy walk_forward_backtester delta_no_trade_band_pct @68280e1).
    no_trade_band_fraction: "0.005"
    # At a rebalance date a price older than this does not mark or trade a position; a held
    # position without one stops the run (the legacy backtester looked back seven days).
    max_price_age_days: 7
    # Trade whole units, as the core rebalances (MASTER_PLAN §5.4).
    whole_units: true
    # Calendar days per year for annualising over elapsed time (legacy STRATEGY_V2_DESIGN §3.5).
    days_per_year: "365.25"

  breakeven:
    # The cost multiplier at which the primary effect falls to theta is searched up to this
    # factor; beyond it the report says "above".
    max_multiplier: "20"
    # The search stops when the multiplier is known to this width.
    multiplier_tolerance: "0.001"

  data:
    # Seconds a download may take before it fails (the shared retry policy is `http`).
    timeout_seconds: 60
    # A rate older than this does not convert a price to the base currency.
    max_fx_age_days: 7
    ken_french:
      base_url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/
      # The library's own markers for a missing value.
      missing_markers: ["-99.99", "-999"]
      bias_notes:
        - The library is revised without vintages; a value may differ from what was public then.
        - US portfolios built from CRSP; returns in USD.
    aqr:
      base_url: https://www.aqr.com/-/media/AQR/Documents/Insights/Data-Sets/
      bias_notes:
        - AQR updates and revises its data sets without vintages.
        - Factor returns are excess returns of long-short portfolios before trading costs.
    fred:
      csv_url: https://fred.stlouisfed.org/graph/fredgraph.csv
      api_url: https://api.stlouisfed.org/fred/series/observations
      # ALFRED's widest real-time period: every vintage the archive holds.
      realtime_start: 1776-07-04
      realtime_end: 9999-12-31
      bias_notes:
        - Without vintages FRED serves the latest revision; availability is the observation date plus the declared lag.
    ecb:
      url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip
      bias_notes:
        - ECB euro foreign exchange reference rates, set around 14:15 CET and published around 16:00 CET on TARGET days; a close before publication would not have had the day's rate.
    yahoo:
      bias_notes:
        - Yahoo closes are split-adjusted backwards and not point in time; a split after the date changes the level.
        - The listing's history only; a fund that closed before the download is absent (survivorship).
      # The universe's research history (`obliskiq research data load-universe`): the tradable
      # candidates and, on request, the stock candidates, read from Yahoo from this date or the
      # instrument's inception, whichever is later. A judgement: two decades of daily closes.
      universe_start: 2006-01-01
      # Yahoo's symbol suffix for each IBKR listing exchange (legacy/old global_vehicles.py
      # EXCHANGE_SUFFIX_MAP, re-keyed by IBKR code); a US venue has none. An exchange missing
      # here has no Yahoo symbol, and its instrument no research history.
      suffixes:
        NYSE: ""
        NASDAQ: ""
        ARCA: ""
        BATS: ""
        AMEX: ""
        TSEJ: ".T"
        LSE: ".L"
        LSEETF: ".L"
        IBIS: ".DE"
        SBF: ".PA"
        AEB: ".AS"
        BVME: ".MI"
        BVME.ETF: ".MI"
        BM: ".MC"
        EBS: ".SW"
        SEHK: ".HK"
        KSE: ".KS"
        NSE: ".NS"
        TASE: ".TA"
        ASX: ".AX"
        TSE: ".TO"
        B3: ".SA"
        SEHKNTL: ".SS"
      # Venues whose numeric codes Yahoo pads with zeros to this width (Hong Kong's 700 is
      # 0700.HK; read on Yahoo 2026-10-22).
      digits:
        SEHK: 4
    msci:
      # MSCI's public end-of-day index levels (the endpoint behind its index pages).
      url: https://app2.msci.com/products/service/index/indexmaster/getLevelDataForGraph
      earliest_start: 1997-01-01
      bias_notes:
        - MSCI index levels are published at the end of each calculation day; MSCI may restate history without vintages.
        - An index, not a fund - no fund costs or tracking difference (a study deducts the vehicle's expense ratio).
    ecb_data:
      # The ECB Data Portal's SDMX REST interface: <base_url>/<flow>/<key>?format=csvdata.
      base_url: https://data-api.ecb.europa.eu/service/data
      bias_notes:
        - ECB Data Portal values as published now; the ECB revises some series without vintages.
    bundesbank:
      # The Bundesbank's time-series database REST interface: <base_url>/<flow>/<key>?format=csv.
      base_url: https://api.statistiken.bundesbank.de/rest/data
      bias_notes:
        - Bundesbank estimates as published now, without vintages.
    derived:
      bias_notes:
        - Computed by the harness from series in the research store; it carries every bias of its inputs.

  # Datasets `obliskiq research data load` knows. Each loads one or more series named
  # <id>.<field>. vendor yahoo: `symbol` (Yahoo's ticker), `currency`, `start`. ken_french: `file`
  # (the zip under base_url), `section` (0 is the first table), `frequency` (daily, monthly or
  # annual), `columns` (null: all), `release_lag_days`. aqr: `file`, `sheet`, `header_row`
  # (1-based), `columns`, `units` (decimal or percent), `date_format` (excel_serial or
  # month_day_year), `release_lag_days`. fred: `series`, `vintages` (true reads ALFRED and needs
  # FRED_API_KEY), `frequency`, `units`, `release_lag_days` (used without vintages), `start`. ecb:
  # `currencies`. Every record adds its own bias notes.
  datasets:
    - id: ecb_fx
      vendor: ecb
      currencies: [USD, GBP, CHF, JPY]
      bias_notes:
        - Units of the currency per euro.
    - id: ff3_monthly
      vendor: ken_french
      file: F-F_Research_Data_Factors_CSV.zip
      section: 0
      frequency: monthly
      columns: null
      release_lag_days: 45
      bias_notes:
        - Fama-French three factors and the one-month bill, monthly, percent converted to decimals.
    - id: aqr_tsmom_monthly
      vendor: aqr
      file: Time-Series-Momentum-Factors-Monthly.xlsx
      sheet: TSMOM Factors
      header_row: 18
      columns: [TSMOM, TSMOM^EQ, TSMOM^FI, TSMOM^CM, TSMOM^FX]
      units: decimal
      date_format: excel_serial
      release_lag_days: 45
      bias_notes:
        - Moskowitz, Ooi and Pedersen time-series momentum factors, excess returns.
    - id: alfred_cpi
      vendor: fred
      series: CPIAUCSL
      vintages: true
      frequency: monthly
      units: index
      release_lag_days: 45
      start: 1990-01-01
      bias_notes:
        - US CPI for all urban consumers, seasonally adjusted, every published vintage.
    - id: eunl
      vendor: yahoo
      symbol: EUNL.DE
      currency: EUR
      start: 2009-01-01
      bias_notes:
        - iShares Core MSCI World UCITS ETF (accumulating) on Xetra.
    # The US market and the one-month bill, public at the month's close: the market's return
    # and the bill's yield were known then; the library recomputes them from CRSP later.
    - id: ff3_market
      vendor: ken_french
      file: F-F_Research_Data_Factors_CSV.zip
      section: 0
      frequency: monthly
      columns: [Mkt-RF, RF]
      release_lag_days: 0
      bias_notes:
        - The US market's excess return and the one-month bill, monthly; public at the month's close (the market's return and the bill's yield were known then; the library's values are a later reconstruction).
    # The developed markets' excess return and the US one-month bill, daily from July 1990 in USD
    # (Bloomberg data), public at the day's close: the market's return and the bill's rate were
    # known then; the library recomputes them later (docs/knowledge/research-sources.md).
    - id: kf_developed_daily
      vendor: ken_french
      file: Developed_3_Factors_Daily_CSV.zip
      section: 0
      frequency: daily
      columns: [Mkt-RF, RF]
      release_lag_days: 0
      bias_notes:
        - Developed markets (23 countries, the US included), value-weighted, from Bloomberg data; a factor model's market return, not an investable index; in USD, unhedged.
        - The US one-month Treasury bill as a daily simple rate that compounds to the month's rate.
    # AQR's market returns of equity indices and of government bonds across countries, monthly
    # from July 1926, each an excess return over local cash; public at the month's close.
    - id: aqr_century_market
      vendor: aqr
      file: Century-of-Factor-Premia-Monthly.xlsx
      sheet: Century of Factor Premia
      header_row: 19
      columns: [Equity indices Market, Fixed income Market]
      units: decimal
      date_format: month_day_year
      release_lag_days: 0
      bias_notes:
        - Ilmanen, Israel, Lee, Moskowitz and Thapar (2021), extended by AQR; each month's excess return over each country's local cash, before costs and fees, gross of currency (local-currency returns); equity indices of up to 43 markets and 10-year government bonds of up to 26, fewer before the 1950s; the weighting of the market columns is not stated in the workbook.
