      san_filings: {url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000891478&type=6-K&owner=include&count=40&output=atom",
                    kind: issuer, region: spain, symbol: SAN}
      tte_filings: {url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000879764&type=6-K&owner=include&count=40&output=atom",
                    kind: issuer, region: france, symbol: TTE}

  # ── halts ──
  halts:
    nasdaq_trader:
      url: https://www.nasdaqtrader.com/rss.aspx?feed=tradehalts
      # The origin its incidents carry; the calendars replace this origin's incidents wholesale.
      origin: nasdaq-trader-halts
      # The feed's Market code -> the venue whose single-stock halts it reports. A code not listed
      # (NYSE American, say) is read and left out.
      markets: {NASDAQ: XNAS, NYSE: XNYS}
      # The halt and resumption times are this venue's local time.
      time_venue: XNYS
      refresh_minutes: 5
      # This many failed reads in a row alert; the last good state stays in force meanwhile.
      alert_after_failures: 3

