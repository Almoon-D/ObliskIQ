      - {id: BIS_CREDIT_GAP_JP, source: bis, frequency: quarterly, units: "770", group: credit,
         key: WS_CREDIT_GAP/Q.JP.P.A.C, release: {policy: reference_plus_lag, lag_days: 290},
         value_vintage: null, consumers: [component:regime_fragility]}
      # Nominal broad effective exchange rates, monthly; September 2026 was out by 2026-10-23.
      - {id: BIS_EER_US, source: bis, frequency: monthly, units: "882", group: fx,
         key: WS_EER/M.N.B.US, release: {policy: reference_plus_lag, lag_days: 52},
         value_vintage: null, consumers: [component:cross_asset_divergence]}
      - {id: BIS_EER_XM, source: bis, frequency: monthly, units: "882", group: fx,
