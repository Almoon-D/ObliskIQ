  # ── positioning (CFTC) ──
  positioning:
    # One ZIP per year (1986 on), each holding annual.txt; the current year's grows weekly.
    annual_url_template: https://www.cftc.gov/files/dea/history/deacot{year}.zip
    socrata_url: https://publicreporting.cftc.gov/resource/6dca-aqww.json
    socrata_page_size: 5000
    # The incremental read re-reads this many weeks, so a report revised after release is
    # picked up.
    incremental_weeks: 8
    backfill_start_year: 2006
    # Crowding (Session 15) ranks the current share of open interest within the trailing window;
    # no rank until the window holds the warm-up (the old ObliskIQ's 156 and 52 weeks).
    percentile_window_weeks: 156
    percentile_min_weeks: 52
    # Velocity: the change of the share over this many reports.
    velocity_weeks: 4
    # The registry: id (what the universe and the board name) -> the CFTC contract market code.
    contracts:
      COT_SP500: {code: "13874A", name: E-mini S&P 500 (CME),
                  consumers: [component:crowding, view:macro_board]}
      COT_NASDAQ: {code: "209742", name: Nasdaq-100 mini (CME), consumers: [component:crowding]}
      COT_UST10Y: {code: "043602", name: UST 10-year note (CBOT), consumers: [component:crowding]}
      # The classic 30-year bond; 043607 is the ultra 10-year note.
      COT_UST30Y: {code: "020601", name: UST bond (CBOT), consumers: [component:crowding]}
      COT_WTI: {code: "067651", name: WTI crude (NYMEX),
                consumers: [component:crowding, hypothesis:H9]}
      COT_NATGAS: {code: "023651", name: Natural gas (NYMEX),
                   consumers: [component:crowding, hypothesis:H9]}
      COT_GOLD: {code: "088691", name: Gold (COMEX),
                 consumers: [component:crowding, hypothesis:H9]}
      COT_SILVER: {code: "084691", name: Silver (COMEX),
                   consumers: [component:crowding, hypothesis:H9]}
      COT_COPPER: {code: "085692", name: Copper (COMEX),
                   consumers: [component:crowding, hypothesis:H9]}
      COT_USD: {code: "098662", name: US dollar index (ICE), consumers: [component:crowding]}
      COT_EUR: {code: "099741", name: Euro FX (CME), consumers: [component:crowding]}

  # ── insiders (SEC EDGAR Form 4) ──
  insiders:
    daily_index_url_template: https://www.sec.gov/Archives/edgar/daily-index/{year}/QTR{quarter}/form.{day}.idx
    archive_url: https://www.sec.gov/Archives
    tickers_url: https://www.sec.gov/files/company_tickers.json
    forms: ["4", "4/A"]
    # SEC's fair-access limit is ten requests a second.
    request_spacing_seconds: 0.15
    # A first run, or one after a gap, reads at most this many days back.
    lookback_days: 10
    # The cluster inputs: open-market purchases (code P) by officers and directors over the
    # trailing window of filing dates.
    purchase_code: P
    cluster_window_days: 30

  # ── events ──
  events:
    polymarket:
      gamma_url: https://gamma-api.polymarket.com
      # Curated events (macro-relevant, each a set of binary markets), by Gamma event slug,
      # read 2026-10-23. An event that ends drops out; its replacement is a reviewed edit.
      curated_events:
        - fed-decision-in-october-20260617190323537
        - fed-decision-in-december-20260729232808632
        - fed-decision-in-january-20260729233815502
        - how-many-fed-rate-cuts-in-2026
        - ecb-interest-rates-december-2026
        - us-recession-by-end-of-2026
        - us-recession-by-end-of-2027-20260807185409760
        - october-inflation-us-monthly
      # Tag discovery: open events under these tags are recorded as candidates for curation.
      discovery_tags: [fed-rates, macro-indicators, recession, tariffs, geopolitics]
      discovery_limit: 20
      # A discovered market is recorded only above this liquidity (US dollars).
      min_discovery_liquidity: 10000
    kalshi:
      api_url: https://api.elections.kalshi.com/trade-api/v2
      # Curated series, read 2026-10-23: Fed decision, upper bound of the funds rate, recession.
      curated_series: [KXFEDDECISION, KXFED, RECSSNBER]
      max_markets_per_series: 60
    # Velocity: the probability change against the newest snapshot at least this old.
    velocity_hours: 24
    gdelt:
      doc_url: https://api.gdeltproject.org/api/v2/doc/doc
      timespan: 7d
      # GDELT answers 429 "limit requests to one every 5 seconds"; the shared egress of a cloud
      # session met it at ten seconds too (2026-10-23).
      request_spacing_seconds: 12
      rate_limited_backoff_seconds: 60
      rate_limited_retries: 2
      # A z-score needs this many prior days; before that the query is warming up.
      min_history_days: 20
      # Region and theme queries (the old ObliskIQ's gdelt_regions.json).
      queries:
        middle_east: {query: '(Iran OR Israel OR Gaza OR Hormuz OR "Middle East")', theme: conflict}
        europe: {query: '(Ukraine OR Russia OR NATO OR "European Union")', theme: conflict}
        asia: {query: '(Taiwan OR "South China Sea" OR "North Korea")', theme: conflict}
        latam: {query: '(Venezuela OR "Latin America") (crisis OR sanctions OR military)', theme: politics}

