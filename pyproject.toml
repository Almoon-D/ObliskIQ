[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obliskiq"
version = "1.6.0"
description = "An autonomous, risk-first portfolio manager for one Interactive Brokers account."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
authors = [{ name = "Alvaro de Luna Luque" }]
keywords = ["interactive-brokers", "ibkr", "portfolio", "risk-parity", "trend-following"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50,<51",
    "exchange-calendars>=4.13.2,<5",
    "httpx>=0.28,<0.29",
    "mcp>=1.20,<2",
    "numpy>=2.3,<3",
    # The Gateway login is verified on 1.64 only (docs/knowledge/ibkr.md): held there until the
    # machine's first login on a newer version passes (.github/dependabot.yml ignores newer ones).
    "playwright>=1.64,<1.65",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "python-dotenv>=1.2.4,<2",
    "PyYAML>=6.0.3,<7",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.38,<1",
    "vadersentiment>=3.3.2,<4",
    "yfinance>=1.7,<2",
]

[project.scripts]
obliskiq = "obliskiq.cli.app:main"

[project.urls]
Source = "https://github.com/Almoon-D/ObliskIQ"

[dependency-groups]
dev = [
    "hatchling>=1.27",
    "hypothesis>=6.140",
    "import-linter>=2.5",
    "mypy>=2.0",
    "pre-commit>=4.3",
    "pytest>=9.0",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "ruff>=0.14",
    "skfolio>=1.11",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
python-preference = "only-managed"

[tool.hatch.build.targets.wheel]
packages = ["src/obliskiq"]

[tool.hatch.build.targets.sdist]
# An explicit list, so nothing is shipped by accident.
only-include = [
    "src",
    "tests",
    "config",
    "docs",
    "research",
    ".github",
    "AGENTS.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "LICENSE",
    "Makefile",
    "README.md",
    "uv.lock",
    ".env.example",
    ".pre-commit-config.yaml",
    ".python-version",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# The release workflow runs this script on its pinned runner's own Python 3.12.
per-file-target-version = { ".github/scripts/*.py" = "py312" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "PTH", "ARG", "ERA"]

[tool.ruff.lint.per-file-ignores]
# Handlers in httpx mock transports take a request the test does not read.
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# exchange_calendars ships no type information; its use is confined to calendars/schedule.py,
# which turns every result into a standard-library type.
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# yfinance ships no type information; its use is confined to research/data.py, which reads its
# history frame through iteration and hands out standard-library types.
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# vaderSentiment ships no type information; its use is confined to data/events/tone.py, which
# returns the compound score as a float.
module = ["vaderSentiment", "vaderSentiment.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Shared test helpers (the fake broker) are plain modules, not tests.
pythonpath = ["tests/support"]
norecursedirs = [
    ".*", "*.egg", "*.egg-info", "_darcs", "build", "CVS", "dist", "node_modules", "venv",
    "{arch}", "__pycache__",
]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # exchange_calendars 4.13.2 builds XHKG's Easter Monday with a bare-integer numpy
    # timedelta; numpy 2.5 deprecates that. Library code, not ours: the filter names the
    # module and the message so nothing else is hidden.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:exchange_calendars.exchange_calendar_xhkg",
    # cryptography 50 deprecates finite-field Diffie-Hellman, which IBKR's OAuth 1.0a handshake
    # requires (docs/knowledge/ibkr.md): the exchange is IBKR's, not ours to change. The pin
    # below 51 keeps a release that drops it out until the handshake is settled.
    "ignore:Diffie-Hellman over finite fields:cryptography.utils.CryptographyDeprecationWarning",
]

[tool.coverage.run]
source = ["obliskiq"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
# Fixed: it no longer follows each session's measurement (docs/DECISIONS.md D152).
fail_under = 99.5

[tool.importlinter]
root_packages = ["obliskiq"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The LLM layer never reaches sizing, gates, orders or the broker"
type = "forbidden"
source_modules = ["obliskiq.llm"]
forbidden_modules = ["obliskiq.decision", "obliskiq.execution", "obliskiq.ibkr"]

[[tool.importlinter.contracts]]
name = "Compute never reaches the broker, the network or execution"
type = "forbidden"
source_modules = [
    "obliskiq.quant", "obliskiq.grid", "obliskiq.engines", "obliskiq.orchestration.compute",
]
forbidden_modules = ["obliskiq.ibkr", "httpx", "obliskiq.execution"]

[[tool.importlinter.contracts]]
name = "Test-only libraries never reach the package (the risk budget's independent check)"
type = "forbidden"
source_modules = ["obliskiq"]
forbidden_modules = ["skfolio", "scipy", "sklearn", "cvxpy"]

[[tool.importlinter.contracts]]
name = "The domain layer imports nothing else of ours"
type = "forbidden"
source_modules = ["obliskiq.domain"]
forbidden_modules = [
    "obliskiq.config", "obliskiq.store", "obliskiq.calendars", "obliskiq.quant",
    "obliskiq.ibkr", "obliskiq.data", "obliskiq.grid", "obliskiq.engines",
    "obliskiq.jurisdiction", "obliskiq.tax", "obliskiq.capital", "obliskiq.llm",
    "obliskiq.decision", "obliskiq.execution", "obliskiq.orchestration", "obliskiq.research",
    "obliskiq.scoreboard", "obliskiq.reporting", "obliskiq.server", "obliskiq.cli",
    "obliskiq.util", "obliskiq.errors", "obliskiq.env", "obliskiq.logging_setup",
]

[[tool.importlinter.contracts]]
name = "Store, calendars and quant do not depend on one another"
type = "independence"
modules = ["obliskiq.store", "obliskiq.calendars", "obliskiq.quant"]

[[tool.importlinter.contracts]]
name = "Jurisdiction policies never reach the broker, the network or execution"
type = "forbidden"
source_modules = ["obliskiq.jurisdiction"]
forbidden_modules = ["obliskiq.ibkr", "httpx", "obliskiq.execution", "obliskiq.store"]

[[tool.importlinter.contracts]]
name = "The live decision path never reads research (DECISIONS D64)"
type = "forbidden"
source_modules = [
    "obliskiq.decision", "obliskiq.execution", "obliskiq.ibkr", "obliskiq.engines",
]
forbidden_modules = ["obliskiq.research", "obliskiq.store.research"]

[[tool.importlinter.contracts]]
name = "Research never reaches execution or the broker"
type = "forbidden"
source_modules = ["obliskiq.research"]
forbidden_modules = ["obliskiq.execution", "obliskiq.ibkr"]

[[tool.importlinter.contracts]]
name = "The collectors read the market; they never reach decisions or orders"
type = "forbidden"
source_modules = ["obliskiq.data"]
forbidden_modules = ["obliskiq.decision", "obliskiq.execution", "obliskiq.llm"]

[[tool.importlinter.contracts]]
name = "Calendars never reach the broker, the network or execution"
type = "forbidden"
source_modules = ["obliskiq.calendars"]
forbidden_modules = ["obliskiq.ibkr", "httpx", "obliskiq.execution"]
