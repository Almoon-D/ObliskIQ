name: CI

# One required job, `ci`, running exactly what a contributor runs locally: `make check`.
# Pushes are built on main only; every other branch is built through its pull request, so
# a commit is never tested twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede a run whose commit is no longer the branch's head. Never on main: two merges in
# quick succession would otherwise leave the first commit with no completed result at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: make check
        run: make check
