# Weekly version updates; minor and patch updates arrive grouped in one pull request per
# ecosystem, majors one by one. Security updates are enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The Gateway's automated login is verified on Playwright 1.64 only (docs/knowledge/ibkr.md);
      # held until the machine's first login on a newer version passes.
      - dependency-name: playwright
        versions: [">=1.65"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
