# ── Cells no instrument measures, and why ───────────────────────────────────
#
# EVERY market x sector pair that no row above measures MUST appear here with a
# reason. The loader refuses a universe where a pair is neither measured nor
# declared, and refuses a pair claimed twice.
#
# That rule is the whole point of this block. The grid used to mark an unmapped
# cell `inapplicable` by INFERRING it from the absence of a grid_measures row —
# the one move this design refuses everywhere else, and the same shape as the
# `options_unavailable_reason` gap that was closed earlier: "nobody looked" and
# "somebody looked and there is nothing" are different claims, and an absent flag
# does not distinguish them. A reason written here is a claim a person made and
# can be held to; a blank is not.
#
# These cells are the AMBITION GAP, not a collection failure — no collector run
# will fill one — so they are excluded from the collection-health denominator and
# reported as their own ratio. Closing one means finding an instrument, which
# means a probe, which means this block shrinks.
#
#   market    a declared market.
#   sectors   an explicit list, or the literal `remaining` for every sector of
#             that market not measured and not claimed by an earlier block.
#             Explicit blocks are declared BEFORE the market's `remaining` block.
#   reason    why, in words, in the cell. It reaches the grid verbatim.

unmapped_cells:

  - market: germany
    sectors: remaining
    reason: >-
      no single-country German sector fund resolves on this route. German sector
      exposure is measured on the eurozone row instead, from the iShares STOXX
      Europe 600 series, which is a EUROPEAN read rather than a German one — and
      that is a coarser measurement, not a substitute. A DAX-sector index would be
      a different index, not a finer one, and none is listed.

  - market: spain
    sectors: remaining
    reason: >-
      no IBEX sector fund exists on this route, and no Spanish single-sector ETF
      of any provider resolves. Spain keeps its broad cell on IBEX35 and its macro
      series; European sector exposure is on the eurozone row.

  - market: france
    sectors: remaining
    reason: >-
      no single-country French sector fund resolves on this route, exactly as for
      germany and spain. French sector exposure is measured on the eurozone row,
      from the iShares STOXX Europe 600 series, which is a EUROPEAN read rather
      than a French one — a coarser measurement and not a substitute. A CAC
      sector index would be a different index, not a finer one, and none is
      listed.

  - market: italy
    sectors: remaining
    reason: >-
      no FTSE MIB sector fund exists on this route, and no Italian single-sector
      ETF of any provider resolves. Italy keeps its broad cell on CSMIB and its
      macro series; European sector exposure is on the eurozone row.

  - market: uk
    sectors: remaining
    reason: >-
      iShares UK Property is the only single-sector fund the sweep found listed in
      London in sterling. The rest of the LSE sector range — the Invesco XLxS and
      XLxP series — tracks the US S&P sectors and is denominated against them, so
      declaring one here would report an AMERICAN sector under Britain's name,
      which is the wrapper failure this file exists to prevent.

  - market: korea
    sectors: remaining
    reason: >-
      IBKR's KRX ETF coverage on this route is banks, steel, construction and
      transport, and nothing else. Probed 2026-09-03 and returning NO contract:
      091160 (KODEX Semiconductor), 091180 (KODEX Autos), 117460 (KODEX Energy &
      Chemicals), 266420 (KODEX Healthcare), 139260 (TIGER 200 IT). The gap is in
      what the route serves, not in what Korea lists.

  - market: hong_kong
    sectors: remaining
    reason: >-
      no Hang Seng sub-index fund is listed beyond the TECH one that measures
      hong_kong/technology. What SEHK does carry in this shape are CHINA sector
      funds — Global X China Semiconductor (3191) and its siblings — which are
      mainland reads quoted in HKD: the wrong country for this row and the wrong
      currency for china's.

  - market: china
    sectors: remaining
    reason: >-
      Stock Connect northbound reaches Shanghai-listed funds, which is how
      china/broad is measured, but no CSI 300 SECTOR fund resolves on that route.
      The China sector funds that do resolve are SEHK-listed and quoted in HKD,
      and an HKD fund under a CNY market's name decomposes against EURCNY, which
      does not describe it — the same objection that rejects the FTSE China A50.

  - market: israel
    sectors: remaining
    reason: >-
      TASE's two ETF families are broad-market, foreign-index and bond trackers:
      of roughly 210 KSM funds and 119 Tachlit funds, the only ISRAELI sector
      index among them is banks, which measures israel/financials. Sector
      granularity beyond banks is not listed rather than not looked for.

  - market: brazil
    sectors: remaining
    reason: >-
      the It Now index-fund family covers the Bovespa financials and basic
      materials indices and stops there. B3's remaining listed funds are broad,
      small-cap, dividend, ESG and fixed-income products, none of which is a
      sector.

  - market: australia
    sectors: [energy]
    reason: >-
      Australia's resources index does not separate miners from energy producers,
      so OZR — which measures australia/materials — already carries this sector's
      constituents. Mapping it here as well would put ONE series in two cells and
      report their correlation as a finding. Declared a gap rather than measured
      twice.

  - market: australia
    sectors: remaining
    reason: >-
      the ASX sector-fund range is resources, financials, listed property and
      technology, all four of which are mapped above. No ASX-listed fund covers
      the remaining sectors.

  - market: canada
    sectors: remaining
    reason: >-
      the TSX sector range IBKR serves is the iShares S&P/TSX Capped sector
      family, and it was not swept: canada was declared on its broad cell and its
      chain, which is what the market axis was widened for. This is a gap nobody
      has looked into rather than one somebody looked into and found empty, and
      it is written that way on purpose — the two are different claims and only
      the first is worth a probe.

  - market: india
    sectors: remaining
    reason: >-
      no NSE sector fund was probed. The Indian ETF range is broad-index, gold and
      debt-heavy and the sector products that exist are bank and IT trackers, but
      none of that was measured on this route, so this is an unswept gap rather
      than an empty one.

# ── Futures roots, for curve_collector ──────────────────────────────────────
#
# DATA USE ONLY. A futures contract is a prohibited instrument and is never
# returned as a tradeable candidate in any code path. The curve drives WRAPPER
# SELECTION — in contango beyond
# commodities.term_structure.contango_max_annualised_for_futures_wrapper, a
# futures-tracking product is rejected in favour of producer equity or a physical
# ETC — so the term structure is required. See instruments.futures_data_use.
#
# Curve SHAPE history is not retrievable retrospectively, exactly as with option
# chains. Whether backwardation is steepening or flattening carries more
# information than its level.
#
# Native exchange is mandatory: SMART returns empty for futures.

futures_roots:
  # tradable is false on EVERY root: a futures contract is a prohibited
  # instrument, full stop. macro_signal is true on every root: the curve is a
  # regime input whether or not the commodity can be held.
  #
  # untradeable_reason distinguishes the two cases that matter. A root with an
  # accessible wrapper can still be expressed — through a physical ETC or a
  # producer equity, chosen by the curve. A root without one is a macro signal
  # and nothing else, and the only expression is the equity proxies declared in
  # commodity_proxies below.
  #
  # OLIVE OIL IS ABSENT ON PURPOSE. No futures market, no ETF, no viable equity
  # expression: there is nothing to track and nothing to trade, so it earns no
  # row rather than a row that can never resolve.

  - {root: CL,  exchange: NYMEX, currency: USD, bucket: energy,             seasonal: false, description: WTI crude,
     tradable: false, macro_signal: true, untradeable_reason: futures contract prohibited; expressible via physical ETC or producer equity,
     cot_series: COT_WTI, inventory_series: WCESTUS1, history_series: DCOILWTICO}
  - {root: BZ,  exchange: NYMEX, currency: USD, bucket: energy,             seasonal: false, description: Brent crude,
     tradable: false, macro_signal: true, untradeable_reason: futures contract prohibited; expressible via physical ETC or producer equity,
     history_series: DCOILBRENTEU}
  - {root: NG,  exchange: NYMEX, currency: USD, bucket: energy,             seasonal: true,  description: Henry Hub natural gas,
     tradable: false, macro_signal: true, untradeable_reason: futures contract prohibited; expressible via producer equity,
     history_series: DHHNGSP}
  - {root: HO,  exchange: NYMEX, currency: USD, bucket: energy,             seasonal: true,  description: heating oil,
