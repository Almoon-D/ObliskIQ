# ═══════════════════════════════════════════════════════════════════════════════
#  obliskiq-lite — the tracked universe
#
#  Reference data, not gates. Every threshold, window and cap lives in
#  config.yaml; this file says only WHICH instruments the collectors walk.
#
#  Seeded into the `universe` and `futures_roots` tables by:
#      obliskiq-collect universe
#
#  Rows declared here have origin='declared' and are never reconciled away.
#  Live account holdings are folded in separately with origin='portfolio_sync'
#  and drop out of collection once the position is gone — see
#  collectors.universe in config.yaml.
#
#  MACRO SERIES DO NOT BELONG IN THIS FILE. Cash-yield benchmarks and every other
#  FRED / ECB / CFTC / EIA series are declared under macro.series in
#  config.yaml and are keyed by series id, not by contract id. The loader REJECTS
#  an instrument whose symbol collides with a declared macro series, so €STR or
#  SOFR can never be handed to the IBKR conid resolver.
#
#  UNVERIFIED: every exchange code and every conid here is documentation-derived.
#  There was no live IBKR access in the sandbox this was written in. What has
#  since been confirmed or corrected against a live connector session is in
#  references/ibkr-playbook.md, which is where every further correction goes.
#
#  Per-row fields:
#    symbol            required
#    conid             optional. When present the resolver uses it verbatim and
#                      never calls /iserver/secdef/search — the escape hatch for
#                      dual-listed and ambiguous symbols.
#    exchange          NATIVE exchange. SMART returns empty for indices and
#                      futures. It also BREAKS THE TIE when no conid is pinned:
#                      every listing of a company answers the same bare ticker,
#                      so the exact-match rule matches all of them and takes the
#                      API's first choice. A match whose listing venue is this
#                      one wins; a venue matching nothing falls through, so it
#                      can only ever sharpen a resolution.
#    history_exchange  what a HISTORY request should send, which is not always
#                      the listing venue. Absent means "use `exchange`"; present
#                      and null means "send no exchange at all". Probed live
#                      2026-08-29: a TSEJ-listed share returns "No market data
#                      permissions" with exchange=TSEJ and full daily history
#                      with the exchange omitted, which inverts the native-
#                      exchange rule that holds for indices and futures.
#                      [CP 2026-09-10] SAN and TTE do the same in Madrid and
#                      Paris — "Chart data unavailable" with the listing venue,
#                      full daily history with it omitted — so this is a
#                      property of the endpoint and not of one exchange.
#    option_exchange   what an OPTION request should send, which is not the
#                      listing venue either. Absent means "prefer `exchange` if
#                      the chain lists it, else whatever the chain reports
#                      first" — the behaviour every US row has always had.
#                      Present, it is sent VERBATIM and is never overridden by
#                      the exchange list /iserver/secdef/search returns, because
#                      that list belongs to whichever listing the search matched
#                      and may not be this one. A declared venue that serves no
#                      strike FAILS the target; it never falls back to SMART.
#    currency, asset_class (STK | ETF | IND | FUT), market, sector
#    is_native_index   this row is the market's level-and-direction source
#    priips_restricted no KID, so the CASH instrument is not buyable from an EU
#                      retail account. Does NOT stop chain collection: listed
#                      options on it remain tradeable.
#    tradable          false requires untradeable_reason
#    options_unavailable_reason
#                      why NO option chain is reachable for this instrument, in
#                      words. Required on a grid_measures row that does not set
#                      collect_chain, and refused on one that does. Grid
#                      indicators 7, 8 and 9 need a chain, and "no chain today"
#                      and "no chain ever" are different claims: the first is a
#                      collection gap and counts against grid.min_coverage_pct,
#                      the second is structural and is reported as the ambition
#                      gap instead. The absence of a flag is not an answer to
#                      which one a cell means, so it is declared.
#    macro_signal      earns a grid row for regime context without ever becoming
#                      a candidate
#    collect_chain     snapshot its option chain daily
#    collect_bars      backfill and maintain its bar history
#    listed_on         YYYY-MM-DD, where known. A sigma fallback on a genuinely
#                      new listing is expected; on anything else it is a warning.
#    country           cap dimension. `market` groups measurements; `country`
#                      constrains concentration, and an ADR must not count
#                      against the wrong one.
#    bucket            commodity bucket, from commodities.buckets. Orthogonal to
#                      `sector`: gold is a precious_monetary bucket and a
#                      materials sector, and pooling the two axes produces
#                      meaningless correlations.
#    grid_measures     this row is the measurement instrument for its
#                      market x sector cell. At most one per cell; the loader
#                      rejects a second. Defaults true for a native index and
#                      false for everything else, so a tradeable candidate does
#                      not silently become a country's proxy.
#    top2_concentration / hedged / coverage_note
#                      ETF disclosure, required wherever a fund measures a cell.
#                      Above data.etf_top2_concentration_flag the output is a
#                      two-stock analysis and the note must say so.
#    dividend_yield    continuous dividend yield q, DECIMAL not percent. Feeds
#                      d1 as (r - q + sigma^2/2)*tau and discounts the spot by
#                      exp(-q*tau), so a payer declared at zero returns an N(d2)
#                      and a delta that are both too high — about 15% and 0.048
#                      on a 5% payer at 150 days — and zombie_test compares
#                      today's N(d2) against the one recorded at entry.
#                      DECLARED, NOT COLLECTED: there is no free global dividend
#                      feed, and a yield inferred from a trailing payment is a
#                      number nobody could audit later. null means NOBODY HAS
#                      DECLARED ONE, which is not the same claim as "this
#                      instrument pays nothing" — check_position_risk says which
#                      of the two it is using, on every assessment.
#    dividend_yield_as_of
#                      YYYY-MM-DD the yield was sourced. Required alongside any
#                      non-null yield: a yield is a fact about a date, and an
#                      undated one cannot be told from a stale one.
#    leveraged / inverse
#                      rejected AT INGESTION. Never written to the universe, so
#                      no later code path can recommend one by forgetting to look.
# ═══════════════════════════════════════════════════════════════════════════════

# ── The grid axes ───────────────────────────────────────────────────────────
#
# Declared, not derived. A market x sector cell with no mapped instrument must
# be an explicit `n/a` with a reason; if the axis were derived from whatever
# happens to be declared below, that cell would simply never exist and the
# coverage gap would be invisible.
#
# `broad` is the market-level row, measured on the NATIVE INDEX. The other
# eleven are the standard sector taxonomy. Commodity BUCKETS are a separate
# axis and live in commodity_state, not here.

sectors:
  - broad
  - energy
  - materials
  - industrials
  - consumer_discretionary
  - consumer_staples
  - healthcare
  - financials
  - technology
  - communication_services
  - utilities
  - real_estate

# Per market: the currency everything local is denominated in, the native index
# that carries level and direction, and the macro series ids grid indicators
# 11-13 read. A null series is a declared coverage gap: the cell reports n/a
# naming the missing series, and never borrows a neighbour's number.
#
#   fx_series          ECB reference rate, UNITS OF LOCAL CURRENCY PER EURO.
#                      Null for the base currency itself.
#   cpi_is_yoy         true when the series is already a year-on-year rate (the
#                      ONS annual-rate series); false when it is an index level
#                      and the rate is computed downstream from two readings a
#                      year apart. An index that its publisher REBASES must be
#                      collected with value_vintage: latest, or those two
#                      readings sit on different bases — see config.yaml's cpi
#                      block and the FredFetcher docstring.
#   slope_short_series and slope_label say WHICH slope the cell reports. A
#                      10y-minus-2y slope and a 10y-minus-policy slope are not
#                      the same measurement and must never be ranked together
#                      without saying which is which.

markets:
  us:
    currency: USD
    country: US
    native_index: SPX
    # Grid indicator 15 exists only where a futures contract does. Declared per
    # market rather than inferred, and absent everywhere it does not apply.
    cot_series: COT_SP500
    fx_series: EURUSD
    cpi_series: CPIAUCSL
    cpi_is_yoy: false
    policy_rate_series: DFF
    long_rate_series: DGS10
    slope_short_series: DGS2
    slope_label: 10y_minus_2y

  eurozone:
    currency: EUR
    country: EU
    native_index: ESTX50
    fx_series: null
    cpi_series: CP0000EZCCM086NEST
    cpi_is_yoy: false
    policy_rate_series: ECB_DFR
    long_rate_series: IRLTLT01EZM156N
    slope_short_series: ECB_DFR
    slope_label: 10y_minus_policy

  germany:
    currency: EUR
    country: DE
    native_index: DAX
    fx_series: null
    cpi_series: CP0000DEM086NEST
    cpi_is_yoy: false
    policy_rate_series: ECB_DFR
    long_rate_series: IRLTLT01DEM156N
    slope_short_series: ECB_DFR
    slope_label: 10y_minus_policy

  spain:
    currency: EUR
    country: ES
    native_index: IBEX35
    fx_series: null
    cpi_series: CP0000ESM086NEST
    cpi_is_yoy: false
    policy_rate_series: ECB_DFR
    long_rate_series: IRLTLT01ESM156N
    slope_short_series: ECB_DFR
    slope_label: 10y_minus_policy

  france:
    currency: EUR
    country: FR
    # A BROAD-ONLY market, and that is a first-class row rather than a lesser
    # one: broad momentum, the two range-based realised-vol estimators, the
    # policy rate and the curve slope are what allocation reads, and germany has
    # run on exactly this shape since the axis was declared. See
    # docs/DECISIONS.md.
    #
    # CAC is PINNED because the bare ticker is a trap twice over. It resolves
    # first to CAMDEN NATIONAL CORP, a USD US bank; CACX is this same Amundi fund
    # quoted in GBP on the London line; and C40 (305372184) is AMUNDI CAC 40 ESG
    # UCITS, a DIFFERENT INDEX whose currency is right and whose constituents are
    # the screened subset. All three confirmed live 2026-09-14 on cp_api.
    native_index: CAC
    fx_series: null
    cpi_series: CP0000FRM086NEST
    cpi_is_yoy: false
    policy_rate_series: ECB_DFR
    long_rate_series: IRLTLT01FRM156N
    slope_short_series: ECB_DFR
    slope_label: 10y_minus_policy

  italy:
    currency: EUR
    country: IT
    native_index: CSMIB
    fx_series: null
    cpi_series: CP0000ITM086NEST
    cpi_is_yoy: false
    policy_rate_series: ECB_DFR
    # IT 10y less the ECB deposit rate, which is a WITHIN-MARKET slope like every
    # other row in this file. Beside germany's DE 10y less the same rate it is
    # the two LEGS of a BTP-Bund spread and not the spread: nothing in
    # indicators.py subtracts one market's leaf from another's, and a
    # cross-market sovereign-spread family would need its own leaves and its own
    # reason codes. See ROADMAP.md — a phase of its own, not a side effect of
    # this one.
    long_rate_series: IRLTLT01ITM156N
    slope_short_series: ECB_DFR
    slope_label: 10y_minus_policy

  uk:
    currency: GBP
    country: GB
    native_index: ISF        # a fund: no FTSE 100 index contract serves. See instruments.
    fx_series: EURGBP
    cpi_series: UK_CPI_YOY
    cpi_is_yoy: true
    policy_rate_series: IUDSOIA
    long_rate_series: IRLTLT01GBM156N
    slope_short_series: IUDSOIA
    slope_label: 10y_minus_policy

  japan:
    currency: JPY
    country: JP
    native_index: N225
    fx_series: EURJPY
    # No CPI this build can read point-in-time, measured 2026-09-15.
    # CPALTT01JPM659N stopped at 2022-04 (and its last value is "."). e-Stat
    # serves a current print and one UPDATED_DATE for the whole table, which
    # is not a release date per observation; the CPI is published on a
    # day-of-month rule that reference_plus_lag cannot express.
    cpi_series: null
    cpi_is_yoy: true
    policy_rate_series: IRSTCI01JPM156N
    long_rate_series: IRLTLT01JPM156N
    slope_short_series: IRSTCI01JPM156N
    slope_label: 10y_minus_policy

  korea:
    currency: KRW
    country: KR
    native_index: K200
    fx_series: EURKRW
    # No CPI this build can read point-in-time, measured 2026-09-15.
    # CPALTT01KRM659N stopped at 2023-11. KOSIS and the Bank of Korea's ECOS
    # both need an application key this build does not hold, and neither
    # states a publication date per observation.
    cpi_series: null
    cpi_is_yoy: true
    policy_rate_series: IRSTCI01KRM156N
    long_rate_series: IRLTLT01KRM156N
    slope_short_series: IRSTCI01KRM156N
    slope_label: 10y_minus_policy

  hong_kong:
    currency: HKD
    country: HK
    native_index: HSI
    fx_series: EURHKD
    # Hong Kong is outside the OECD CPI family and outside the FRED long-rate
    # family. Declared null rather than substituted with China's.
    cpi_series: null
    cpi_is_yoy: true
    policy_rate_series: null
    long_rate_series: null
    slope_short_series: null
    slope_label: null

  china:
    currency: CNY
    country: CN
    # GAP CLOSED, on the second attempt and by a different route. The first probe
    # looked for an index contract and for a Hong Kong listing, found XIN9 is not
    # a contract, XIN9I an empty series, and iShares FTSE China A50 priced in HKD,
    # and correctly refused the A50: measuring a CNY market on an HKD fund reports
    # HKD returns under China's name and hands indicator 11 an EURCNY series that
    # does not describe them. What it did not look at is SEHKNTL — Shanghai-Hong
    # Kong Stock Connect northbound — which reaches Shanghai-listed funds at their
    # own Shanghai quote. See 510300 under instruments, and the currency caveat
    # recorded there and in docs/DECISIONS.md.
    native_index: "510300"
    fx_series: EURCNY
    # No CPI this build can read point-in-time, measured 2026-09-15.
    # CPALTT01CNM659N stopped at 2025-04. No keyless route to an NBS print
    # carrying a publication date was found. china declares no policy rate
    # either, so indicator 12 was already inapplicable; this is the FX
    # decomposition's local real leg, and it reports its own absence.
    cpi_series: null
    cpi_is_yoy: true
    policy_rate_series: null
    # IRLTLT01CNM156N WAS HERE. It is not a series FRED serves any more:
    # `fred/series?series_id=IRLTLT01CNM156N` answers `The series does not
    # exist`, and a search of FRED for a China long rate returns nothing to put
    # in its place. The other nine IRLTLT01* series are alive and unaffected.
    # A declared null is an inapplicable cell naming the missing declaration,
    # which is the honest reading; a dead id left here was a collection failure
    # every run. See docs/DECISIONS.md and references/macro-playbook.md.
    long_rate_series: null
    slope_short_series: null
    slope_label: null

  india:
    currency: INR
    country: IN
    native_index: NIFTYBEES
    fx_series: EURINR
    # No CPI this build can read point-in-time, measured 2026-09-15.
    # CPALTT01INM659N stopped at 2025-03. MoSPI's API needs registration and
    # publishes no per-observation release date.
    cpi_series: null
    cpi_is_yoy: true
    policy_rate_series: IRSTCI01INM156N
    # IRLTLT01INM156N DOES NOT EXIST. FRED answers HTTP 400 `The series does not
    # exist` — re-measured 2026-09-14 with this build's own key — which is the
    # same failure IRLTLT01CNM156N gave in PR 10, and nothing in FRED replaces
    # it. Declared null, so the cell names the missing declaration rather than
    # borrowing a neighbour's curve. china is already on the axis on exactly
    # these terms and brazil on the structurally identical ones.
    long_rate_series: null
    slope_short_series: null
    slope_label: null

  israel:
    currency: ILS
    country: IL
    native_index: KSM.F59    # a fund: no TA-35 index contract exists at IBKR.
    fx_series: EURILS
    # No CPI this build can read point-in-time, measured 2026-09-15.
    # CPALTT01ILM659N stopped at 2025-03. The CBS index API is live and current
    # (api.cbs.gov.il/index/data/price?id=120010, measured 2026-09-15) and
    # carries no date of any kind beside the value — not a release date, not
    # an update stamp. A value with no publication date is invisible to
    # known_at, so collecting it would add rows and no reading.
    cpi_series: null
    cpi_is_yoy: true
    policy_rate_series: IRSTCI01ILM156N
    long_rate_series: IRLTLT01ILM156N
    slope_short_series: IRSTCI01ILM156N
    slope_label: 10y_minus_policy

  brazil:
    currency: BRL
    country: BR
    native_index: BOVA11     # a fund: no Ibovespa index contract resolves.
    fx_series: EURBRL
    # No CPI this build can read point-in-time, measured 2026-09-15.
    # CPALTT01BRM659N stopped at 2025-04. IBGE's SIDRA serves the IPCA freely
    # and states no publication date per observation.
    cpi_series: null
    cpi_is_yoy: true
    policy_rate_series: IRSTCI01BRM156N
    # No Brazilian long rate in the FRED redistribution. Declared null.
    long_rate_series: null
    slope_short_series: null
    slope_label: null

  australia:
    currency: AUD
    country: AU
    native_index: STW        # a fund: the AS51 contract is on PSE and returns empty.
    fx_series: EURAUD
    # No CPI this build can read point-in-time, measured 2026-09-15.
    # CPALTT01AUQ659N stopped at 2025-01. The ABS SDMX service carries no
    # per-observation publication date.
    cpi_series: null
    cpi_is_yoy: true
    policy_rate_series: IRSTCI01AUM156N
    long_rate_series: IRLTLT01AUM156N
    slope_short_series: IRSTCI01AUM156N
    slope_label: 10y_minus_policy

  canada:
    currency: CAD
    country: CA
    # The one market on this axis outside the US whose option chain is both
    # reachable AND priced — measured 2026-09-14, see XIU under instruments. It
    # is therefore NOT a broad-only row: indicators 7, 8 and 9 reach canada/broad.
    native_index: XIU
    fx_series: EURCAD
    cpi_series: CA_CPI
    cpi_is_yoy: false
    policy_rate_series: IRSTCI01CAM156N
    long_rate_series: IRLTLT01CAM156N
    slope_short_series: IRSTCI01CAM156N
    slope_label: 10y_minus_policy

