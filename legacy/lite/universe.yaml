# ── Commodity proxies, and the regression that tests each one ───────────────
#
# A producer equity is never a clean commodity exposure. Every proxy declares
# the reference series it is regressed against, monthly, over
# commodities.proxies.min_observations_months. Below commodities.proxies.min_r2
# the proxy is flagged unreliable and MUST NOT be presented as commodity
# exposure at all — a diversified specialty chemicals company is not lithium.
#
#   reference_kind: macro  -> a declared macro.series id
#                   curve  -> the front-month history in curve_snapshots for a
#                             tracked root. Self-collected, so it only becomes
#                             usable as the curve series accumulates.
#                   none   -> no free reference price exists. The regression is
#                             not run and the proxy is unreliable BY DECLARATION,
#                             with the reason carried through to the output.

commodity_proxies:
  - {symbol: XLE,  root: CL, reference: DCOILWTICO,   reference_kind: macro,
     note: "US energy majors: integrated and refining margins, not crude alone"}
  - {symbol: TTE,  root: BZ, reference: DCOILBRENTEU, reference_kind: macro,
     note: "European integrated major; Brent-linked but carries refining and utility earnings"}
  - {symbol: FCX,  root: HG, reference: PCOPPUSDM,    reference_kind: macro,
     note: "materially gold-exposed as well as copper, and high equity beta"}
  - {symbol: GDX,  root: GC, reference: GC,           reference_kind: curve,
     note: "gold MINERS: operating leverage and jurisdiction risk on top of bullion"}
  - {symbol: NTR,  root: NG, reference: DHHNGSP,      reference_kind: macro,
     note: "nitrogen tracks natural gas via Haber-Bosch; gas is 70-80% of ammonia cost"}
  - {symbol: MOS,  root: NG, reference: DHHNGSP,      reference_kind: macro,
     note: "phosphate and potash: an input-cost linkage to gas, weaker than nitrogen's"}
  - {symbol: BG,   root: ZC, reference: ZC,           reference_kind: curve,
     note: "an agricultural PROCESSOR: crush margins can widen as crop prices fall"}
  - {symbol: JDEP, root: KC, reference: KC,           reference_kind: curve,
     note: "roaster: hedged input costs and brand pricing power damp the pass-through"}
  - {symbol: BARN, root: CC, reference: CC,           reference_kind: curve,
     note: "cost-plus contracts pass cocoa through, so the beta is to volumes as much as price"}
  - {symbol: LISN, root: CC, reference: CC,           reference_kind: curve,
     note: "premium chocolate: brand pricing power makes this the weaker of the two cocoa proxies"}
  - {symbol: ALB,  root: null, reference: null,       reference_kind: none,
     note: "no free lithium carbonate price series exists, and ALB is a diversified specialty chemicals company rather than a lithium pure-play"}
  - {symbol: CCJ,  root: null, reference: null,       reference_kind: none,
     note: "spot uranium is thin and the term-contract market that matters is not free; CCJ also carries contracted pricing and equity beta"}
