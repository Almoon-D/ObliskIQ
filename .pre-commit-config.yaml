# Local hooks run the locked tool versions from uv.lock, so a hook and `make check` can
# never disagree. legacy/ is a read-only snapshot and is never touched.
exclude: ^legacy/
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy --strict (src)
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: lint-imports
        name: import contracts
        entry: uv run --locked lint-imports
        language: system
        pass_filenames: false
        types_or: [python, pyi]
