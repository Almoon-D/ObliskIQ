    lock: research/preregistrations/core-risk-scaling.lock
    report: research/reports/core-risk-scaling.md
    test: E-blend
    outcome:
      decision: inconclusive
      labels: [sign uncertain, outside the owner's point, low power]
      estimate_a_year: "0.0134"
      interval: ["-0.0254", "0.0482"]
      theta: "0.01"
      power: "0.039"
      sample: 2004-12 to 2026-09
    comparison:
      against: E-declared
      decision: inconclusive
      estimate_a_year: "-0.0016"
      interval: ["-0.0142", "0.0094"]
      theta: "0.005"
    owner_point: 30 % reached on 22.0 % of 20-year paths (the point allows 5 %)
    result: >-
      Over 2004-2026 it grew 1.34 % a year more than static A after costs and Spanish tax, an
      interval from -2.54 % to 4.82 %, and 0.16 % less than the same base held at its declared
      share. It reached a 30 % drawdown on 22.0 % of 20-year paths: outside the owner's point,
      so it earns neither capital nor a shadow run (DECISIONS D95).
  - id: core-risk-scaling-b-fast
    title: The global 60/40 (WORLD 60 %, EGB_INT 40 %) scaled to 9.15 % by a 21-day EWMA
    status: retired
    preregistration: research/preregistrations/core-risk-scaling.md
    lock: research/preregistrations/core-risk-scaling.lock
    report: research/reports/core-risk-scaling.md
    test: B-fast
    outcome:
      decision: inconclusive
      labels: [sign uncertain, outside the owner's point, low power]
      estimate_a_year: "0.0133"
      interval: ["-0.0179", "0.0413"]
      theta: "0.01"
      power: "0.055"
      sample: 2004-12 to 2026-09
    comparison:
      against: B-declared
      decision: insufficient
      estimate_a_year: "-0.0051"
      interval: ["-0.0123", "0.0021"]
      theta: "0.005"
    owner_point: 30 % reached on 16.2 % of 20-year paths (the point allows 5 %)
    result: >-
      Over 2004-2026 it grew 1.33 % a year more than static A after costs and Spanish tax, an
      interval from -1.79 % to 4.13 %, but 0.51 % less than the 60/40 held whole, an interval
      from -1.23 % to 0.21 % that rules out half a point a year from re-estimating volatility. It
      reached a 30 % drawdown on 16.2 % of 20-year paths against 40.1 % for the 60/40 held
      whole: outside the owner's point (DECISIONS D95).
  - id: selection-insider-clusters
    hypothesis: H2
    title: Insider-purchase clusters (SEC Form 4)
    status: idea
    audit: research/reports/selection-data-audit.md
    data_needed: >-
      Daily US stock prices that keep delisted companies, with their delisting returns, from 2006
      (CRSP; Norgate US Platinum, US$630 a year on 2026-10-17); free prices miss 74.5 % of the
      2006 events and 11.6 % of the 2025 ones. Or the events collected forward from the SEC
      (Session 10), where survivorship cannot arise.
  - id: selection-stock-composite
    hypothesis: H4
    title: >-
      A stock-level composite: nearness to the 52-week high, 12-1 momentum with a crash guard,
      profitability
    status: idea
    audit: research/reports/selection-data-audit.md
    data_needed: >-
      The same survivorship-free US price history as H2 (free prices miss 76.5 % of the 2006
      issuers sampled and 12.5 % in 2025), and point-in-time fundamentals before 2009 if the
      test is to start earlier (the SEC's XBRL data sets give them from 2009, every filer from
      mid-2011).
